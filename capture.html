<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="求职速记"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>求职速记</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang SC',sans-serif;background:#F2F7F1;color:#1C2E22;min-height:100vh;padding:24px 20px;}
h1{font-size:19px;color:#2F4538;margin-bottom:4px;}
.sub{font-size:12px;color:#4A6350;margin-bottom:20px;}
textarea{width:100%;min-height:180px;padding:14px;border-radius:12px;border:1px solid #C2D9BE;background:#fff;font-size:16px;line-height:1.5;font-family:inherit;resize:vertical;}
textarea:focus{outline:2px solid #5C7A60;outline-offset:1px;}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#2F4538;color:#fff;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer;}
button:active:not(:disabled){transform:scale(0.98);}
button:disabled{background:#A8C5A0;}
.msg{font-size:13px;margin-top:10px;text-align:center;min-height:18px;}
.msg.ok{color:#2F6640;}
.msg.err{color:#b05050;}
.keybox{margin-top:28px;font-size:12px;}
.keybox summary{color:#4A6350;cursor:pointer;}
.keybox input{width:100%;padding:10px;border-radius:8px;border:1px solid #C2D9BE;margin-top:10px;font-size:14px;font-family:inherit;}
.keybox button{background:#5C7A60;margin-top:8px;padding:10px;font-size:13px;}
.target{display:flex;gap:8px;margin-bottom:16px;}
.target button{flex:1;width:auto;margin-top:0;padding:10px;font-size:14px;background:#fff;color:#4A6350;border:1.5px solid #C2D9BE;}
.target button.active{background:#2F4538;color:#fff;border-color:#2F4538;}
</style>
</head>
<body>
<h1>📥 求职速记</h1>
<div class="sub">粘贴文字或帖子链接，存进对应的收件箱，回电脑再整理</div>
<div class="target">
  <button type="button" id="targetJob" class="active">📋 秋招</button>
  <button type="button" id="targetPhd">🎓 申博</button>
</div>
<textarea id="content" placeholder="从小红书/公众号复制的内容，或者直接写公司名…" autofocus></textarea>
<button id="submitBtn">存进收件箱</button>
<div class="msg" id="msg"></div>
<details class="keybox" id="keybox">
  <summary>设置密钥</summary>
  <input id="keyInput" type="text" placeholder="首次使用需要输入密钥" autocomplete="off"/>
  <button id="saveKeyBtn">保存密钥</button>
</details>
<script>
const KEY_STORAGE = "jt_inbox_key";
const TARGET_STORAGE = "jt_inbox_target";
const contentEl = document.getElementById("content");
const submitBtn = document.getElementById("submitBtn");
const msgEl = document.getElementById("msg");
const keyInput = document.getElementById("keyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");
const targetJobBtn = document.getElementById("targetJob");
const targetPhdBtn = document.getElementById("targetPhd");

let target = localStorage.getItem(TARGET_STORAGE) === "phd" ? "phd" : "job";
const renderTarget = () => {
  targetJobBtn.classList.toggle("active", target === "job");
  targetPhdBtn.classList.toggle("active", target === "phd");
};
renderTarget();
targetJobBtn.onclick = () => { target = "job"; localStorage.setItem(TARGET_STORAGE, target); renderTarget(); };
targetPhdBtn.onclick = () => { target = "phd"; localStorage.setItem(TARGET_STORAGE, target); renderTarget(); };

keyInput.value = localStorage.getItem(KEY_STORAGE) || "";
saveKeyBtn.onclick = () => {
  localStorage.setItem(KEY_STORAGE, keyInput.value.trim());
  msgEl.textContent = "✅ 密钥已保存";
  msgEl.className = "msg ok";
};

submitBtn.onclick = async () => {
  const content = contentEl.value.trim();
  const key = localStorage.getItem(KEY_STORAGE) || "";
  if (!content) return;
  if (!key) {
    msgEl.textContent = "⚠️ 请先展开下面「设置密钥」填写";
    msgEl.className = "msg err";
    return;
  }
  submitBtn.disabled = true;
  msgEl.textContent = "保存中…";
  msgEl.className = "msg";
  try {
    const res = await fetch("/api/inbox-add", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Inbox-Key": key },
      body: JSON.stringify({ content, target }),
    });
    if (res.status === 401) {
      document.getElementById("keybox").open = true;
      throw new Error("密钥错误");
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "failed");
    contentEl.value = "";
    msgEl.textContent = "✅ 已存入收件箱";
    msgEl.className = "msg ok";
  } catch (err) {
    msgEl.textContent = err.message === "密钥错误" ? "⚠️ 密钥错误，请在下方重新填写" : "⚠️ 保存失败，检查网络";
    msgEl.className = "msg err";
  }
  submitBtn.disabled = false;
  contentEl.focus();
};
</script>
</body>
</html>
