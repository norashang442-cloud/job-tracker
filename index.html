<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang SC','Inter',sans-serif;background:#F2F7F1;color:#1C2E22;}
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #5C7A60;outline-offset:1px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#F2F7F1;}
::-webkit-scrollbar-thumb{background:#A8C5A0;border-radius:3px;}
.card:hover{box-shadow:0 4px 16px rgba(47,69,56,0.2)!important;}

/* Button press effect */
button{transition:transform 0.1s,box-shadow 0.1s,background 0.15s!important;}
button:hover:not(:disabled){transform:scale(0.97);}
button:active:not(:disabled){transform:scale(0.95);}

/* Modal animations */
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-backdrop{animation:backdropIn 0.2s ease}
.modal-box{animation:modalIn 0.22s cubic-bezier(0.34,1.56,0.64,1)}

/* Tab fade */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab-content{animation:fadeIn 0.18s ease}

/* Collapsible slide */
.collapsible{overflow:hidden;transition:max-height 0.22s cubic-bezier(0.4,0,0.2,1),opacity 0.18s ease;}
.collapsible.open{max-height:600px;opacity:1;}
.collapsible.closed{max-height:0;opacity:0;}

/* Header / agenda layout, incl. narrow screens */
.hdr{padding:12px 24px;}
.tabscroll{overflow-x:auto;scrollbar-width:none;max-width:100%;}
.tabscroll::-webkit-scrollbar{display:none;}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:640px){
  .hdr{padding:10px 12px;}
  .mtab{padding:6px 12px!important;font-size:13px!important;}
  .hdr-actions button,.hdr-actions label{padding:7px 12px!important;font-size:13px!important;}
  .agenda-grid{grid-template-columns:1fr;gap:12px;}
}

/* Top panel: dark nav row + light info row, three aligned columns */
/* 左栏、中栏按内容定宽（名字+切换开关、三个流程标签），剩下的宽度都给右栏的日程 */
.top-grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:400px 390px minmax(0,1fr);}
.top-cell{padding:14px 20px;min-width:0;}
.top-div-dark{border-left:1px solid rgba(255,255,255,0.16);}
.hdr-actions>*{flex:1 1 auto;text-align:center;}
@media (max-width:1100px){
  .top-grid{grid-template-columns:1fr;}
  .top-div-dark,.top-div-light{border-left:none!important;}
  .top-cell{padding:10px 14px;}
}
</style>

function icsEscape(s){
  return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}

function buildMilestoneICS({company,position,stage,date,time,note}){
  const pad=n=>String(n).padStart(2,"0");
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const uid=`${Date.now()}-${Math.random().toString(36).slice(2)}@job-tracker`;
  const summary=icsEscape([company,position,stage].filter(Boolean).join("-"));
  const description=icsEscape(note||"");
  const [y,m,d]=date.split("-");
  let dtLines,alarmTrigger;
  if(time){
    const [hh,mm]=time.split(":");
    dtLines=[`DTSTART:${y}${m}${d}T${hh}${mm}00`];
    alarmTrigger="-PT2H";
  }else{
    const start=new Date(Number(y),Number(m)-1,Number(d));
    const end=new Date(start); end.setDate(end.getDate()+1);
    const endStr=`${end.getFullYear()}${pad(end.getMonth()+1)}${pad(end.getDate())}`;
    dtLines=[`DTSTART;VALUE=DATE:${y}${m}${d}`,`DTEND;VALUE=DATE:${endStr}`];
    alarmTrigger="-P1D";
  }
  // RFC5545 requires VEVENT properties before any VALARM sub-component,
  // otherwise strict parsers (Apple Calendar included) silently drop SUMMARY.
  const lines=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//job-tracker//milestone//CN",
    "BEGIN:VEVENT",`UID:${uid}`,`DTSTAMP:${dtstamp}`,...dtLines,
    `SUMMARY:${summary}`,
    description?`DESCRIPTION:${description}`:null,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:提醒",`TRIGGER:${alarmTrigger}`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR",
  ].filter(Boolean);
  return lines.join("\r\n");
}

function downloadICS(filename,content){
  const blob=new Blob([content],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- 提醒（每日邮件 + 日历订阅），与 phd.html 保持一致 ----------
const pad2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const diffDays=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
const isDue=(e,today)=>e.remindOn.includes(today)||(e.repeatUntilDone&&today>=e.date);
const dueLabel=(date,today)=>{const d=diffDays(today,date);return d===0?"今天":d===1?"明天":d>1?`还有 ${d} 天`:`已逾期 ${-d} 天`;};
const getKey=()=>{try{return localStorage.getItem("jt4_inbox_key")||""}catch{return ""}};

// Push this page's reminders to the cloud (debounced) so the daily email / calendar feed can see them.
function useReminderSync(target,events){
  const [sync,setSync]=useState({state:"idle"});
  const json=JSON.stringify(events);
  const run=async()=>{
    const key=getKey();
    if(!key){setSync({state:"nokey"});return;}
    setSync(s=>({...s,state:"syncing"}));
    try{
      const res=await fetch("/api/reminders-sync",{method:"POST",headers:{"Content-Type":"application/json","X-Inbox-Key":key},body:JSON.stringify({target,events:JSON.parse(json)})});
      if(res.status===401){setSync({state:"badkey"});return;}
      const data=await res.json();
      if(!res.ok) throw new Error(data.error);
      setSync({state:"ok",count:data.count});
    }catch{setSync({state:"error"});}
  };
  useEffect(()=>{const t=setTimeout(run,1500);return()=>clearTimeout(t);},[json]);
  // 本地缓存一份，给另一个页面的日程卡片读
  useEffect(()=>{try{localStorage.setItem("agenda_"+target,json)}catch{}},[json]);
  return [sync,run];
}

// 让问候语、日期、日程跟着时间走：页面一直开着时每 5 分钟重新渲染一次
function useClock(ms=300000){
  const [,setTick]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setTick(t=>t+1),ms);return()=>clearInterval(id);},[]);
}

// 中栏标题：「秋招第 N 天」，从最早一条记录算起（日期字符串，或 Date.now() 生成的记录 id）
function firstDate(values){
  const days=values.map(v=>{
    if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    if(typeof v==="number"&&v>1577836800000&&v<Date.now()+86400000){const d=new Date(v);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
    return null;
  }).filter(Boolean).sort();
  return days[0]||null;
}
function DayCount({label,since}){
  useClock();
  if(!since) return null;
  return <div style={{fontFamily:SERIF,fontSize:18,fontWeight:700,color:C.fir,marginBottom:12}}>{label}第 {diffDays(since,todayStr())+1} 天</div>;
}

// 顶部右栏开头：随时段变化的一句问候，和一句克制的当日概况（时间敏感的内容都放在右栏）
// 上午 6–13 点，下午 13–18 点，晚上 18–22 点，深夜 22–6 点
function DayHeader({events}){
  useClock();
  const h=new Date().getHours();
  const greet=h>=6&&h<13?"上午好，先挑一件事开始吧":h>=13&&h<18?"下午好，进度怎么样了？":h>=18&&h<22?"晚上好，记得看看明天的计划":"夜深了，明天再继续吧";
  const today=todayStr();
  const todayItems=events.filter(e=>e.date===today||(e.repeatUntilDone&&e.date<today));
  const n=k=>todayItems.filter(e=>e.kind===k).length;
  const parts=[];
  if(n("milestone")) parts.push(`${n("milestone")} 场笔试 / 面试`);
  if(n("activity")) parts.push(`${n("activity")} 个活动`);
  const rest=todayItems.length-n("milestone")-n("activity");
  if(rest) parts.push(`${rest} 件事待处理`);
  return(
    <div style={{marginBottom:12}}>
      <div style={{fontFamily:SERIF,fontSize:18,fontWeight:700,color:C.fir}}>{greet}</div>
      {parts.length>0&&<div style={{fontSize:13,color:C.textLight,marginTop:3}}>今天 {parts.join("，")}</div>}
    </div>
  );
}

// 顶部右栏的日程：本页事项正常显示、点击打开对应记录（今天 / 明天最多先显示 4 条）；
// 另一边的事项读它最近一次保存的本地缓存，按天合并成一行淡淡显示「这段时间被占了」，不可点。「未来 7 天」默认折叠。
const NEAR_LIMIT=4;
function AgendaPanel({events,target,onOpen}){
  useClock();
  const other=target==="job"?"phd":"job";
  const otherLabel=other==="job"?"秋招":"申博";
  const [weekOpen,setWeekOpen]=useState(()=>{try{return localStorage.getItem("agenda_week_open")==="1"}catch{return false}});
  const toggleWeek=()=>setWeekOpen(v=>{try{localStorage.setItem("agenda_week_open",v?"0":"1")}catch{} return !v;});
  const [nearOpen,setNearOpen]=useState(()=>{try{return localStorage.getItem("agenda_near_open")!=="0"}catch{return true}});
  const toggleNear=()=>setNearOpen(v=>{try{localStorage.setItem("agenda_near_open",v?"0":"1")}catch{} return !v;});
  const [nearAll,setNearAll]=useState(false);
  const [openGroups,setOpenGroups]=useState({});
  const toggleGroup=k=>setOpenGroups(g=>({...g,[k]:!g[k]}));
  const today=todayStr(),tomorrow=addDays(today,1),week=addDays(today,7);
  let otherEvents=[];
  try{otherEvents=JSON.parse(localStorage.getItem("agenda_"+other)||"[]")}catch{}
  const all=[...events.map(e=>({...e,mine:true})),...otherEvents.map(e=>({...e,mine:false}))]
    .sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  // 另一边逾期的待办不占用具体时间段，只显示本页自己的
  const near=all.filter(e=>e.date===today||e.date===tomorrow||(e.mine&&e.repeatUntilDone&&e.date<today));
  const later=all.filter(e=>e.date>tomorrow&&e.date<=week);
  const whenOf=(date,nearCol)=>nearCol?(date<today?`逾期${diffDays(date,today)}天`:date===today?"今天":"明天"):`${date.slice(5)} 周${weekday(date)}`;

  // 本页条目逐条列出；另一边的条目在它当天第一次出现的位置合并成一行
  const lines=list=>{
    const out=[],groups={};
    list.forEach(e=>{
      if(e.mine){out.push({e});return;}
      if(!groups[e.date]){groups[e.date]=[];out.push({date:e.date,items:groups[e.date]});}
      groups[e.date].push(e);
    });
    return out;
  };
  const render=(list,nearCol,limit)=>{
    let shown=0,hidden=0;
    const rows=lines(list).map(l=>{
      if(!l.e){
        const one=l.items.length===1?l.items[0]:null;
        const key=(nearCol?"n-":"w-")+l.date;
        const open=!!openGroups[key];
        const label=it=>`${it.title}${it.time?` ${it.time}`:""}`;
        return(
          <div key={"o-"+key} style={{fontSize:11,color:C.mist,padding:"2px 0"}}>
            <div onClick={one?undefined:()=>toggleGroup(key)} style={{display:"flex",gap:8,cursor:one?"default":"pointer"}}>
              <span style={{width:62,flexShrink:0}}>{whenOf(l.date,nearCol)}</span>
              <span style={{wordBreak:"break-word"}}>
                <span style={{border:`1px solid ${C.border}`,borderRadius:4,padding:"0 4px",marginRight:5}}>{otherLabel}</span>
                {one?label(one):`${l.items.length} 项 ${open?"▲":"▼"}`}
              </span>
            </div>
            {!one&&open&&(
              <div style={{paddingLeft:70,marginTop:2}}>
                {l.items.map(it=><div key={it.id} style={{padding:"1px 0",wordBreak:"break-word"}}>{label(it)}</div>)}
              </div>
            )}
          </div>
        );
      }
      const e=l.e;
      if(limit&&shown>=limit){hidden++;return null;}
      shown++;
      const time=e.time?` ${e.time}${e.endTime?`–${e.endTime}`:""}`:"";
      return(
        <div key={e.id} onClick={()=>onOpen(e)} title={e.detail||"点击打开"} style={{display:"flex",gap:8,fontSize:13,padding:"4px 6px",margin:"0 -6px",borderRadius:7,cursor:"pointer"}}
          onMouseOver={ev=>ev.currentTarget.style.background=C.cream} onMouseOut={ev=>ev.currentTarget.style.background="transparent"}>
          <span style={{width:62,flexShrink:0,fontSize:12,fontWeight:700,color:e.date<=today?"#c0392b":C.textLight}}>{whenOf(e.date,nearCol)}</span>
          <span style={{color:C.text,wordBreak:"break-word"}}>{KIND_ICON[e.kind]||"•"} {e.title}<span style={{color:C.sage,fontWeight:600}}>{time}</span></span>
        </div>
      );
    });
    return {rows,hidden};
  };
  const nearView=render(near,true,nearAll?0:NEAR_LIMIT);
  // 标题里的数字：本页事项正常显示，另一边的数量用浅色附在后面
  const counts=list=>{
    const mine=list.filter(e=>e.mine).length,theirs=list.length-mine;
    return <>{mine}{theirs>0&&<span style={{fontWeight:400,color:C.mist,fontSize:12}}> · {otherLabel} {theirs}</span>}</>;
  };
  return(
    <div>
      <div onClick={toggleNear} style={{fontSize:13,fontWeight:700,color:C.fir,marginBottom:6,cursor:"pointer"}}>
        🗓 今天 / 明天 · {counts(near)} {nearOpen?"▲":"▼"}
      </div>
      {nearOpen&&(near.length?nearView.rows:<div style={{fontSize:12,color:C.mist}}>今明两天没有安排</div>)}
      {nearOpen&&(nearView.hidden>0||nearAll)&&(
        <div onClick={()=>setNearAll(v=>!v)} style={{fontSize:12,color:C.sage,cursor:"pointer",marginTop:2}}>
          {nearAll?"收起 ▲":`还有 ${nearView.hidden} 项 ▼`}

      <div onClick={toggleWeek} style={{marginTop:12,fontSize:13,fontWeight:700,color:C.fir,cursor:"pointer"}}>
        🗓 未来 7 天 · {counts(later)} {weekOpen?"▲":"▼"}
      </div>
      {weekOpen&&<div style={{marginTop:4}}>{later.length?render(later,false,0).rows:<div style={{fontSize:12,color:C.mist}}>未来一周没有安排</div>}</div>}
    </div>
  );
}

const EVENT_STATUS=[

];
const EVENT_TZS=[["Asia/Shanghai","北京时间"],["Europe/London","英国时间"],["Europe/Paris","欧洲中部时间"],["America/New_York","美东时间"],["America/Los_Angeles","美西时间"],["Asia/Tokyo","日本时间"],["Australia/Sydney","悉尼时间"],["UTC","UTC"]];
const tzLabel=tz=>(EVENT_TZS.find(t=>t[0]===tz)||[tz,tz])[1];
const EVENT_TYPES={
  job:["宣讲会","Insight Day / 开放日","网络研讨会","Networking","求职技能讲座","其他"],
  phd:["项目宣讲 / Open Day","招生答疑","学术讲座 / Seminar","导师 / 实验室介绍","其他"],
};
const EMPTY_EVENT={title:"",organizer:"",type:"",date:"",time:"",endTime:"",timezone:"Asia/Shanghai",joinUrl:"",regUrl:"",regDeadline:"",status:"interested",note:"",takeaway:"",company:"",school:"",applicationId:null};
const migrateEvent=a=>({...EMPTY_EVENT,...a,status:EVENT_STATUS.some(s=>s.key===a.status)?a.status:"interested",id:a.id??Date.now()});

// Wall-clock time in `tz` → the viewer's local date/time (activities are stored in their original timezone).
function toLocal(date,time,tz){
  if(!date||!time||!tz) return {date,time};
  try{
    const [y,m,d]=date.split("-").map(Number),[hh,mm]=time.split(":").map(Number);
    const fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const offset=t=>{const p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-t;};
    const guess=Date.UTC(y,m-1,d,hh,mm);
    let inst=guess-offset(guess);
    inst=guess-offset(inst);
    const L=new Date(inst);
    return {date:`${L.getFullYear()}-${pad2(L.getMonth()+1)}-${pad2(L.getDate())}`,time:`${pad2(L.getHours())}:${pad2(L.getMinutes())}`};
  }catch{return {date,time};}
}
const localWhen=a=>{
  const L=toLocal(a.date,a.time,a.timezone);
  const E=a.endTime?toLocal(a.date,a.endTime,a.timezone):null;
  const converted=L.date!==a.date||L.time!==a.time;
  return {...L,endTime:E&&E.date===L.date?E.time:"",converted};
};

// 已报名的活动：前一天出现在提醒邮件里，并同步到订阅日历（不设闹钟）；想参加且有报名截止的，截止前一天和当天提醒。
function buildActivityEvents(acts,today){
  const ev=[];
  acts.forEach(a=>{
    const W=localWhen(a);
    if(a.status==="registered"&&W.date&&W.date>=addDays(today,-30)){
      const detail=[a.organizer,W.converted?`原时间 ${a.date.slice(5)} ${a.time} ${tzLabel(a.timezone)}`:"",a.joinUrl?"参会链接见标题":""].filter(Boolean).join(" · ");
      ev.push({id:`act-${a.id}`,kind:"activity",title:a.title,detail,date:W.date,time:W.time||"",endTime:W.endTime,url:a.joinUrl||a.regUrl||"",remindOn:[addDays(W.date,-1)],noAlarm:true});
    }
    if(a.status==="interested"&&a.regDeadline&&a.regDeadline>=addDays(today,-1)){
      ev.push({id:`act-${a.id}-reg`,kind:"deadline",title:`报名截止：${a.title}`,detail:a.organizer||"",date:a.regDeadline,time:"",url:a.regUrl||"",remindOn:[addDays(a.regDeadline,-1),a.regDeadline],noAlarm:true});
    }
  });
  return ev;
}

  const past=withWhen.filter(x=>!upcoming.includes(x)).sort((x,y)=>(y.W.date+y.W.time).localeCompare(x.W.date+x.W.time));

// 笔试/面试等环节：前一天 + 当天提醒；计划投递的岗位截止：前 7 天、前 1 天、当天提醒。
function buildJobEvents(jobs,toApply,today){
  const ev=[];
  const cutoff=addDays(today,-30);
  jobs.forEach(j=>{
    if(j.status==="rejected") return;
    (j.milestones||[]).forEach(m=>{
      if(!m.date||m.date<cutoff) return;
      ev.push({id:`job-${j.id}-${m.id}`,kind:"milestone",title:[j.company,j.position,m.stage].filter(Boolean).join(" · "),detail:m.note||"",date:m.date,time:m.time||"",url:j.url||"",remindOn:[addDays(m.date,-1),m.date]});
    });
  });
  toApply.forEach(t=>{
    if(t.intent!=="计划投递"||t.rolling||!t.deadline||t.deadline<cutoff) return;
    ev.push({id:`ta-${t.id}`,kind:"deadline",title:`${t.company} · ${t.position} 投递截止`,detail:"",date:t.deadline,time:"",url:t.url||"",remindOn:[-7,-1,0].map(n=>addDays(t.deadline,n))});
  });
  // 自定义「提醒我」日期：到期后每天重复，直到投出（转到投递追踪）、删除或改日期
  toApply.forEach(t=>{
    if(!t.remindDate) return;
    ev.push({id:`ta-${t.id}-remind`,kind:"todo",title:`${t.company} · ${t.position}`,detail:t.remindNote||(t.rolling?"滚动招聘，越早投越好":t.intent),date:t.remindDate,time:"",url:t.url||"",remindOn:[t.remindDate],repeatUntilDone:true});
  });
  return ev;
}

function findDuplicateWarning(companyName,currentId,jobs,toApply){
  const name=(companyName||"").trim().toLowerCase();
  if(!name) return "";
  const jobMatches=jobs.filter(j=>j.company.trim().toLowerCase()===name&&j.id!==currentId);
  const taMatches=toApply.filter(t=>t.company.trim().toLowerCase()===name&&t.id!==currentId);
  if(!jobMatches.length&&!taMatches.length) return "";
  const parts=[];
  if(jobMatches.length) parts.push(`${jobMatches.length}条已投递记录`);
  if(taMatches.length) parts.push(`${taMatches.length}条待投递记录`);
  return `⚠️ 已有${parts.join('、')}`;
}

const normName=s=>(s||"").trim().toLowerCase();
function findCompanyByName(companies,name){
  const n=normName(name);
  return n?companies.find(c=>normName(c.company)===n):undefined;
}

const URL_RE=/(https?:\/\/[^\s<>"'）】」』，。！？；：]+)/g;
function linkifyText(text){
  if(!text) return text;
  return String(text).split(URL_RE).map((part,i)=>
    /^https?:\/\//.test(part)
      ?<a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:C.fir,wordBreak:"break-all"}} onClick={e=>e.stopPropagation()}>{part}</a>
      :part
  );
}

    setEditingId(m.id);setStage(m.stage);setDate(m.date);setTime(m.time||"");setNote(m.note||"");

function JobForm({initial,companies,jobs,toApply,onSave,onCancel}){
  const [form,setForm]=useState(initial||EMPTY);
  const [addCompany,setAddCompany]=useState(!initial?.id);
  const [rawText,setRawText]=useState("");
  const [parsing,setParsing]=useState(false);
  const [msg,setMsg]=useState("");
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const parse=async()=>{
    if(!rawText.trim()) return;
    setParsing(true); setMsg("正在提取信息…");
    try{
      const res=await fetch("/api/extract",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:rawText})
      });
      const json=await res.json();
      if(!res.ok) throw new Error(json.error||"failed");
      setForm(f=>({...f,
        company:  json.company  ||f.company,
        position: json.position ||f.position,
        industry: INDUSTRIES.includes(json.industry)?json.industry:f.industry,
        type:     TYPES.includes(json.type)?json.type:f.type,
        source:   SOURCES.includes(json.source)?json.source:f.source,
      }));
      setMsg("✅ 提取成功，请核对后保存");
    }catch{ setMsg("⚠️ 提取失败，请手动填写"); }
    setParsing(false);
  };

  return(
    <div>
      <h3 style={{margin:"0 0 16px",color:C.fir,fontSize:17}}>{initial?.id?"编辑投递":"添加投递"}</h3>
      {!initial?.id&&(
        <div style={{background:C.frost,borderRadius:10,padding:14,marginBottom:16}}>
          <label style={{...lbl,color:C.moss}}>🔍 自动提取职位信息</label>

            placeholder="复制职位页面文字粘贴至此，自动识别公司、职位等信息…"
            style={{...inp,height:72,resize:"vertical",fontSize:12,lineHeight:1.5,fontFamily:"inherit",marginTop:6,marginBottom:10}}/>

            {msg?<span style={{fontSize:12,color:msg.startsWith("✅")?C.sage:msg.startsWith("⚠️")?"#b07030":C.textLight}}>{msg}</span>:<span style={{fontSize:12,color:C.textLight}}>粘贴文字后点击自动填写</span>}
            <button onClick={parse} disabled={parsing||!rawText.trim()}
              style={{padding:"7px 16px",borderRadius:8,border:"none",background:parsing?C.mist:C.fir,color:C.white,cursor:parsing?"not-allowed":"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,marginLeft:10}}>
              {parsing?"提取中…":"自动填写"}
            </button>
          </div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <CompanyField form={form} set={set} companies={companies} jobs={jobs} toApply={toApply} addCompany={addCompany} setAddCompany={setAddCompany}/>

        <div><label style={lbl}>公司行业</label>
          <select style={inp} value={form.industry||""} onChange={e=>set("industry",e.target.value)}>
            <option value="">请选择</option>
            {INDUSTRIES.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div><label style={lbl}>职位类型</label>
          <select style={inp} value={form.type} onChange={e=>set("type",e.target.value)}>
            {TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>

          <select style={inp} value={form.source} onChange={e=>set("source",e.target.value)}>

function RemindRow({item,onSnooze}){
  if(!item.remindDate) return null;
  const today=todayStr();
  const due=today>=item.remindDate;
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,marginBottom:6,background:due?"#FDECEC":C.cream,borderRadius:7,padding:"4px 8px"}}>
      <span style={{fontSize:11,color:due?"#c0392b":C.textLight,fontWeight:due?700:400,wordBreak:"break-word"}}>

function ToApplyForm({initial,companies,jobs,toApply,onSave,onCancel}){
  const [form,setForm]=useState(initial||EMPTY_TOAPPLY);
  const [addCompany,setAddCompany]=useState(!initial?.id);
  const [rawText,setRawText]=useState("");
  const [parsing,setParsing]=useState(false);
  const [msg,setMsg]=useState("");
  const [reasonSelect,setReasonSelect]=useState(()=>{
    const r=initial?.watchReason||"";
    if(!r) return WATCH_REASONS[0];
    return WATCH_REASONS.includes(r)&&r!=="其他"?r:"其他";
  });
  const [customReason,setCustomReason]=useState(()=>{
    const r=initial?.watchReason||"";
    return (r&&!WATCH_REASONS.includes(r))?r:"";
  });
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const selectReason=v=>{setReasonSelect(v);set("watchReason",v==="其他"?customReason:v);};
  const changeCustomReason=v=>{setCustomReason(v);set("watchReason",v);};

  const parse=async()=>{
    if(!rawText.trim()) return;
    setParsing(true); setMsg("正在提取信息…");
    try{
      const res=await fetch("/api/extract",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:rawText})
      });
      const json=await res.json();
      if(!res.ok) throw new Error(json.error||"failed");
      setForm(f=>({...f,
        company:  json.company  ||f.company,
        position: json.position ||f.position,
      }));
      setMsg("✅ 提取成功，请核对后保存");
    }catch{ setMsg("⚠️ 提取失败，请手动填写"); }
    setParsing(false);
  };

  return(
    <div>
      <h3 style={{margin:"0 0 16px",color:C.fir,fontSize:17}}>{initial?.id?"编辑待投递":"添加待投递"}</h3>
      {!initial?.id&&(
        <div style={{background:C.frost,borderRadius:10,padding:14,marginBottom:16}}>
          <label style={{...lbl,color:C.moss}}>🔍 自动提取职位信息</label>
          <textarea value={rawText} onChange={e=>setRawText(e.target.value)}
            placeholder="复制职位页面文字粘贴至此，自动识别公司、职位等信息…"
            style={{...inp,height:72,resize:"vertical",fontSize:12,lineHeight:1.5,fontFamily:"inherit",marginTop:6,marginBottom:10}}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            {msg?<span style={{fontSize:12,color:msg.startsWith("✅")?C.sage:msg.startsWith("⚠️")?"#b07030":C.textLight}}>{msg}</span>:<span style={{fontSize:12,color:C.textLight}}>粘贴文字后点击自动填写</span>}
            <button onClick={parse} disabled={parsing||!rawText.trim()}
              style={{padding:"7px 16px",borderRadius:8,border:"none",background:parsing?C.mist:C.fir,color:C.white,cursor:parsing?"not-allowed":"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,marginLeft:10}}>
              {parsing?"提取中…":"自动填写"}
            </button>
          </div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <CompanyField form={form} set={set} companies={companies} jobs={jobs} toApply={toApply} addCompany={addCompany} setAddCompany={setAddCompany}/>
        <div><label style={lbl}>职位名称 *</label><input style={inp} value={form.position} onChange={e=>set("position",e.target.value)} placeholder="如：Graduate Engineer"/></div>
        <div><label style={lbl}>职位类型</label>
          <select style={inp} value={form.type||"全职"} onChange={e=>set("type",e.target.value)}>
            {TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{gridColumn:"1/-1"}}>
          <label style={lbl}>关注类型</label>
          <div style={{display:"flex",gap:8}}>
            {INTENTS.map(v=>(
              <button key={v} type="button" onClick={()=>{
                set("intent",v);
                if(v==="长期关注"&&!form.watchReason) set("watchReason",reasonSelect==="其他"?customReason:reasonSelect);
              }}
                style={{flex:1,padding:"8px 0",borderRadius:8,border:`1.5px solid ${form.intent===v?C.sage:C.border}`,
                  background:form.intent===v?C.frost:C.white,color:form.intent===v?C.moss:C.textLight,
                  fontWeight:form.intent===v?700:500,fontSize:13,cursor:"pointer"}}>{v}</button>
            ))}
          </div>
        </div>
        {form.intent==="长期关注"?(
          <div style={{gridColumn:"1/-1"}}>
            <label style={lbl}>关注原因</label>
            <select style={inp} value={reasonSelect} onChange={e=>selectReason(e.target.value)}>
              {WATCH_REASONS.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
            {reasonSelect==="其他"&&(
              <input style={{...inp,marginTop:8}} value={customReason} onChange={e=>changeCustomReason(e.target.value)} placeholder="请输入具体原因"/>
            )}
          </div>
        ):(
          <div>
            <label style={lbl}>截止日期</label>
            {!form.rolling&&<input type="date" style={inp} value={form.deadline||""} onChange={e=>set("deadline",e.target.value)}/>}
            <label style={{display:"flex",alignItems:"center",gap:6,marginTop:form.rolling?0:8,fontSize:12,color:C.textLight,cursor:"pointer"}}>
              <input type="checkbox" checked={!!form.rolling} onChange={e=>{
                const rolling=e.target.checked;
                setForm(f=>({...f,rolling,deadline:rolling?"":f.deadline,
                  remindDate:rolling&&!f.remindDate?addDays(todayStr(),ROLLING_REMIND_DAYS):f.remindDate}));
              }}/>
              滚动招聘（Rolling Basis，无固定截止日期）
            </label>
          </div>
        )}
        <div style={{gridColumn:"1/-1",background:C.cream,borderRadius:10,padding:"10px 12px",border:`1px solid ${C.border}`}}>
          <label style={lbl}>⏰ 提醒我（可选，到期后每天在提醒邮件里出现，直到投出或改日期）</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <input type="date" style={{...inp,width:160}} value={form.remindDate||""} onChange={e=>set("remindDate",e.target.value)}/>
            <input style={{...inp,flex:1,minWidth:160}} value={form.remindNote||""} onChange={e=>set("remindNote",e.target.value)} placeholder="提醒内容，如：去看看开没开 / 本周内投掉"/>
            {form.remindDate&&<button type="button" onClick={()=>setForm(f=>({...f,remindDate:"",remindNote:""}))} style={{padding:"0 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,color:C.textLight,fontSize:12,cursor:"pointer"}}>清除</button>}
          </div>
        </div>
        <div><label style={lbl}>薪资/待遇</label><input style={inp} value={form.salary||""} onChange={e=>set("salary",e.target.value)} placeholder="如：£30k / 25-30k"/></div>
        <div><label style={lbl}>工作地点</label><input style={inp} value={form.location||""} onChange={e=>set("location",e.target.value)} placeholder="如：London / Remote"/></div>
        <div><label style={lbl}>优先级</label>
          <select style={inp} value={form.priority||"中"} onChange={e=>set("priority",e.target.value)}>
            {["高","中","低"].map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div style={{gridColumn:"1/-1"}}><label style={lbl}>职位链接</label><input style={inp} value={form.url||""} onChange={e=>set("url",e.target.value)} placeholder="https://..."/></div>
        <div style={{gridColumn:"1/-1"}}><label style={lbl}>备注</label><textarea style={inpArea} value={form.note||""} onChange={e=>set("note",e.target.value)} placeholder="可选"/></div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:18,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"8px 20px",borderRadius:8,border:`1px solid ${C.border}`,background:C.cream,color:C.textLight,cursor:"pointer",fontSize:14}}>取消</button>
        <button onClick={()=>form.company&&form.position&&onSave(form.intent==="长期关注"?form:{...form,watchReason:""},addCompany)}
          style={{padding:"8px 22px",borderRadius:8,border:"none",background:C.fir,color:C.white,cursor:"pointer",fontSize:14,fontWeight:600}}>保存</button>
      </div>
    </div>
  );
}

function App(){
  const [jobs,setJobs]=useState(()=>{try{return JSON.parse(localStorage.getItem("jt4")||"[]").map(migrateJob)}catch{return []}});
  const [toApply,setToApply]=useState(()=>{
    let items;
    try{items=JSON.parse(localStorage.getItem("jt4_toApply")||"[]").map(migrateToApply)}catch{return []}
    // 一次性：给提醒功能上线前已有的「计划投递 + 滚动招聘」岗位补上默认提醒日期
    try{
      if(!localStorage.getItem("jt4_rolling_remind_init")){
        const d=addDays(todayStr(),ROLLING_REMIND_DAYS);
        items=items.map(t=>t.intent==="计划投递"&&t.rolling&&!t.remindDate?{...t,remindDate:d}:t);
        localStorage.setItem("jt4_rolling_remind_init","1");
      }
    }catch{}
    return items;
  });
  const [companies,setCompanies]=useState(()=>{try{return JSON.parse(localStorage.getItem("jt4_companies")||"[]").map(migrateCompany)}catch{return []}});
  const [mainTab,setMainTab]=useState("tracker");
  const [view,setView]=useState("看板");
  const [modal,setModal]=useState(null);
  const [taModal,setTaModal]=useState(false);
  const [cModal,setCModal]=useState(false);
  const [filter,setFilter]=useState("all");
  const [typeFilter,setTypeFilter]=useState("all");
  const [taFilter,setTaFilter]=useState("all");
  const [dragId,setDragId]=useState(null);
  const [dragOverCardId,setDragOverCardId]=useState(null);
  const [manualExpand,setManualExpand]=useState({});
  const [reviewOpen,setReviewOpen]=useState(true);
  const [trackedOpen,setTrackedOpen]=useState(true);
  const [inboxItems,setInboxItems]=useState([]);
  const [inboxOpen,setInboxOpen]=useState(false);
  const [inboxLoading,setInboxLoading]=useState(false);
  const [inboxError,setInboxError]=useState("");
  const [convertingId,setConvertingId]=useState(null);
  const [convertingInboxId,setConvertingInboxId]=useState(null);
  const [inboxExtractions,setInboxExtractions]=useState({});
  const dragOver=useRef(null);
  const dragIdRef=useRef(null);
  useEffect(()=>{dragIdRef.current=dragId;},[dragId]);
  useEffect(()=>{
    let rafId=null,scrollDir=0;
    const doScroll=()=>{if(scrollDir!==0){window.scrollBy(0,scrollDir*10);rafId=requestAnimationFrame(doScroll);}};
    const onDragOver=e=>{
      if(!dragIdRef.current) return;
      const zone=80,y=e.clientY,vh=window.innerHeight;
      const d=y<zone?-1:y>vh-zone?1:0;
      if(d!==scrollDir){scrollDir=d;if(rafId)cancelAnimationFrame(rafId);if(d!==0)rafId=requestAnimationFrame(doScroll);}
    };
    const stop=()=>{scrollDir=0;if(rafId){cancelAnimationFrame(rafId);rafId=null;}};
    document.addEventListener("dragover",onDragOver);
    document.addEventListener("dragend",stop);
    document.addEventListener("drop",stop);
    return()=>{document.removeEventListener("dragover",onDragOver);document.removeEventListener("dragend",stop);document.removeEventListener("drop",stop);stop();};
  },[]);

  useEffect(()=>{try{localStorage.setItem("jt4",JSON.stringify(jobs))}catch{}},[jobs]);
  useEffect(()=>{try{localStorage.setItem("jt4_toApply",JSON.stringify(toApply))}catch{}},[toApply]);
  useEffect(()=>{try{localStorage.setItem("jt4_companies",JSON.stringify(companies))}catch{}},[companies]);

  const [acts,setActs]=useState(()=>{try{return JSON.parse(localStorage.getItem("jt4_events")||"[]").map(migrateEvent)}catch{return []}});
  useEffect(()=>{try{localStorage.setItem("jt4_events",JSON.stringify(acts))}catch{}},[acts]);
  const [actModal,setActModal]=useState(null);

  const [reminderOpen,setReminderOpen]=useState(false);
  const reminderEvents=[...buildJobEvents(jobs,toApply,todayStr()),...buildActivityEvents(acts,todayStr())];
  const [reminderSync,resyncReminders]=useReminderSync("job",reminderEvents);

  // Match the item's company name against followed companies; optionally create one if none matches.
  const linkCompany=(item,addCompany,extra={})=>{
    const name=item.company.trim();
    const co=findCompanyByName(companies,name);
    if(co) return {...item,companyId:co.id};
    if(!addCompany) return {...item,companyId:null};
    const id=Date.now()+1;
    setCompanies(c=>[...c,{...EMPTY_COMPANY,...extra,company:name,id}]);
    return {...item,companyId:id};
  };
  const companyIds=new Set(companies.map(c=>c.id));
  // Legacy records may lack a valid companyId, so fall back to matching by name.
  const belongsTo=(item,co)=>item.companyId===co.id||(!companyIds.has(item.companyId)&&normName(item.company)===normName(co.company));

  const save=(f,addCompany)=>{
    f=linkCompany(f,addCompany,{industry:f.industry||""});
    if(modal==="add") setJobs(j=>[...j,{...f,id:Date.now()}]);
    else setJobs(j=>j.map(x=>x.id===modal.id?{...modal,...f}:x));
    setModal(null);
  };
  const del=id=>{if(confirm("确认删除？"))setJobs(j=>j.filter(x=>x.id!==id));};
  const reorderJobs=(draggedId,beforeId,newStatus)=>{
    setJobs(prev=>{
      const idx=prev.findIndex(j=>j.id===draggedId);
      if(idx===-1) return prev;
      const dragged={...prev[idx],status:newStatus};
      const rest=prev.filter(j=>j.id!==draggedId);
      if(beforeId==null) return [...rest,dragged];
      const targetIdx=rest.findIndex(j=>j.id===beforeId);
      if(targetIdx===-1) return [...rest,dragged];
      const result=[...rest];
      result.splice(targetIdx,0,dragged);
      return result;
    });
  };
  const exportData=()=>{
    const payload={version:SCHEMA_VERSION,exportedAt:new Date().toISOString(),jobs};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`job-tracker-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(a.href);
  };
  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const raw=JSON.parse(ev.target.result);
        const incoming=Array.isArray(raw)?raw:(Array.isArray(raw.jobs)?raw.jobs:[]);
        if(incoming.length===0)throw new Error();
        const migrated=incoming.map(migrateJob);
        if(jobs.length>0&&!confirm(`当前有 ${jobs.length} 条记录，导入将合并数据，确认继续？`))return;
        const merged=[...jobs];
        migrated.forEach(item=>{if(!merged.find(x=>x.id===item.id))merged.push(item);});
        setJobs(merged);alert(`✅ 导入成功，共 ${merged.length} 条记录`);
      }catch{alert("⚠️ 文件格式有误");}
    };
    r.readAsText(file);e.target.value="";
  };

  const companiesWithPositions=companies.map(co=>{
    const linkedJobs=jobs.filter(j=>belongsTo(j,co)).map(j=>{
      const st=STATUS.find(s=>s.key===j.status)||STATUS[0];
      return {id:`job-${j.id}`,position:j.position,tagLabel:st.label,tagColor:st.color,tagBg:st.bg};
    });
    const linkedToApply=toApply.filter(t=>belongsTo(t,co)).map(t=>({
      id:`ta-${t.id}`,position:t.position,tagLabel:t.intent,
      tagColor:t.intent==="长期关注"?C.textLight:C.white,
      tagBg:t.intent==="长期关注"?C.frost:C.sage,
    }));
    return {co,positions:[...linkedJobs,...linkedToApply]};
  });
  const companiesNeedReview=companiesWithPositions.filter(x=>x.positions.length===0);
  const companiesTracked=companiesWithPositions.filter(x=>x.positions.length>0);

  const filtered=jobs.filter(j=>filter==="all"||j.status===filter).filter(j=>typeFilter==="all"||j.type===typeFilter);
  const total=jobs.length,interviews=jobs.filter(j=>j.status==="interview").length;
  const offers=jobs.filter(j=>j.status==="offer").length;

  const tabBtn=active=>({padding:"6px 16px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:active?C.fir:"transparent",color:active?C.white:C.textLight,transition:"all 0.2s"});
  const selStyle={padding:"6px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,color:C.text,fontSize:13,cursor:"pointer"};

  const saveTA=(item,addCompany)=>{
    item=linkCompany(item,addCompany);
    if(taModal==="add"||!taModal.id) setToApply(a=>[...a,{...item,id:Date.now()}]);
    else setToApply(a=>a.map(x=>x.id===taModal.id?{...taModal,...item}:x));
    setTaModal(false);
  };
  const delTA=id=>{if(confirm("确认删除？"))setToApply(a=>a.filter(x=>x.id!==id));};
  const snoozeTA=item=>setToApply(a=>a.map(x=>x.id===item.id?{...x,remindDate:addDays(todayStr(),ROLLING_REMIND_DAYS)}:x));
  const promoteTA=item=>{
    setJobs(j=>[...j,{...EMPTY,company:item.company,position:item.position,type:item.type||"全职",url:item.url,note:item.note,companyId:item.companyId??null,id:Date.now()}]);
    delTA(item.id);
    setMainTab("tracker");
  };

  const saveCo=item=>{
    if(cModal==="add"||!cModal.id) setCompanies(c=>[...c,{...item,id:Date.now()}]);
    else{
      setCompanies(c=>c.map(x=>x.id===cModal.id?{...cModal,...item}:x));
      // Keep linked positions' company name in sync when the company is renamed.
      if(item.company!==cModal.company){
        const rename=x=>belongsTo(x,cModal)?{...x,company:item.company,companyId:cModal.id}:x;
        setJobs(j=>j.map(rename));
        setToApply(a=>a.map(rename));
      }
    }
    setCModal(false);
    if(convertingInboxId){ deleteInboxItem(convertingInboxId); setConvertingInboxId(null); }
  };
  const delCo=id=>{if(confirm("确认删除？关联到该公司的具体职位不会被删除"))setCompanies(c=>c.filter(x=>x.id!==id));};
  const closeCModal=()=>{setCModal(false);setConvertingInboxId(null);};

  const saveAct=item=>{
    if(actModal==="add"||!actModal.id) setActs(a=>[...a,{...item,id:Date.now()}]);
    else setActs(a=>a.map(x=>x.id===actModal.id?{...actModal,...item}:x));
    setActModal(null);
    if(convertingInboxId){ deleteInboxItem(convertingInboxId); setConvertingInboxId(null); }
  };
  const delAct=id=>{if(confirm("确认删除这个活动？"))setActs(a=>a.filter(x=>x.id!==id));};
  const setActStatus=(id,status)=>setActs(a=>a.map(x=>x.id===id?{...x,status}:x));
  const closeActModal=()=>{setActModal(null);setConvertingInboxId(null);};

  const getInboxKey=()=>{
    let key=localStorage.getItem("jt4_inbox_key")||"";
    if(!key){
      key=prompt("请输入收件箱密钥（部署时在 Vercel 环境变量 INBOX_SECRET 里设置的值）")||"";
      if(key) localStorage.setItem("jt4_inbox_key",key);
    }
    return key;
  };
  const extractForItem=async item=>{
    setInboxExtractions(prev=>({...prev,[item.id]:{loading:true}}));
    try{
      const isEvent=item.kind==="event";
      const res=await fetch(isEvent?"/api/extract-event":"/api/extract",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...(item.type==="url"?{url:item.content}:{text:item.content}),...(isEvent?{context:"job"}:{})}),
      });
      const json=await res.json();
      setInboxExtractions(prev=>({...prev,[item.id]:{...json,loading:false}}));
    }catch{
      setInboxExtractions(prev=>({...prev,[item.id]:{loading:false,error:true}}));
    }
  };
  const fetchInbox=async()=>{
    const key=getInboxKey();
    if(!key) return;
    setInboxLoading(true); setInboxError("");
    try{
      const res=await fetch("/api/inbox-list",{headers:{"X-Inbox-Key":key}});
      if(res.status===401){ setInboxError("⚠️ 密钥错误，点右边「重设密钥」重新输入"); setInboxLoading(false); return; }
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||"failed");
      const items=data.items||[];
      setInboxItems(items);
      items.forEach(item=>{
        const lineCount=new Set(item.content.split("\n").map(l=>l.trim()).filter(Boolean)).size;
        if((item.kind==="event"||lineCount<=1)&&!inboxExtractions[item.id]) extractForItem(item);
      });
    }catch{ setInboxError("⚠️ 加载失败，检查网络"); }
    setInboxLoading(false);
  };
  const toggleInbox=()=>{
    const next=!inboxOpen;
    setInboxOpen(next);
    if(next) fetchInbox();
  };
  const resetInboxKey=()=>{
    localStorage.removeItem("jt4_inbox_key");
    setInboxError("");
    fetchInbox();
  };
  const deleteInboxItem=async id=>{
    const key=getInboxKey();
    if(key){
      try{
        await fetch("/api/inbox-delete",{
          method:"POST",
          headers:{"Content-Type":"application/json","X-Inbox-Key":key},
          body:JSON.stringify({id}),
        });
      }catch{}
    }
    setInboxItems(items=>items.filter(i=>i.id!==id));
    setInboxExtractions(prev=>{const next={...prev};delete next[id];return next;});
  };
  const ignoreInboxItem=item=>{ if(confirm("确认忽略这条？")) deleteInboxItem(item.id); };
  const batchSplitInboxItem=(item,lines)=>{
    if(!lines||lines.length<2) return;
    if(!confirm(`确认拆分成 ${lines.length} 个关注公司？`)) return;
    const now=Date.now();
    const newCompanies=lines.map((name,i)=>({...EMPTY_COMPANY,company:name,id:now+i}));
    setCompanies(c=>[...c,...newCompanies]);
    setInboxOpen(false);
    setMainTab("companies");
    deleteInboxItem(item.id);
  };
  const convertInboxToEvent=async item=>{
    setConvertingId(item.id);
    let extracted=item.kind==="event"?inboxExtractions[item.id]:null;
    if(!extracted||extracted.loading||extracted.error){
      try{
        const res=await fetch("/api/extract-event",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({...(item.type==="url"?{url:item.content}:{text:item.content}),context:"job"}),
        });
        extracted=await res.json();
      }catch{ extracted={}; }
    }
    const pick={};
    ["title","organizer","company","date","time","endTime","timezone","joinUrl","regUrl","regDeadline"].forEach(k=>{if(extracted[k]) pick[k]=extracted[k];});
    setConvertingInboxId(item.id);
    setInboxOpen(false);
    setMainTab("events");
    setActModal({...EMPTY_EVENT,type:EVENT_TYPES.job[0],...pick,regUrl:pick.regUrl||(item.type==="url"?item.content:""),note:item.type==="url"?"":item.content});
    setConvertingId(null);
  };
  const convertInboxItem=async item=>{
    setConvertingId(item.id);
    let extracted=inboxExtractions[item.id];
    if(!extracted||extracted.loading||extracted.error){
      try{
        const res=await fetch("/api/extract",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(item.type==="url"?{url:item.content}:{text:item.content}),
        });
        extracted=await res.json();
      }catch{ extracted={}; }
    }
    setConvertingInboxId(item.id);
    const officialUrl=/^https?:\/\//i.test(extracted.officialUrl||"")?extracted.officialUrl:"";
    setInboxOpen(false);
    setMainTab("companies");
    setCModal({
      ...EMPTY_COMPANY,
      company:extracted.company||"",
      industry:INDUSTRIES.includes(extracted.industry)?extracted.industry:"",
      url:officialUrl||(item.type==="url"?item.content:""),
      note:item.content,
    });
    setConvertingId(null);
  };

  const remindHot=reminderEvents.filter(e=>e.date===todayStr()||(e.repeatUntilDone&&e.date<todayStr())).length;
  const remindWarn=["badkey","error"].includes(reminderSync.state);
  // 日程卡片点击：按提醒条目的 id 找回对应记录并打开编辑
  const openFromAgenda=e=>{
    const [kind,id]=e.id.split("-");
    const nid=Number(id);
    if(kind==="job"){const j=jobs.find(x=>x.id===nid);if(j){setMainTab("tracker");setModal(j);}}
    else if(kind==="ta"){const t=toApply.find(x=>x.id===nid);if(t){setMainTab("toApply");setTaModal(t);}}
    else if(kind==="act"){const a=acts.find(x=>x.id===nid);if(a){setMainTab("events");setActModal(a);}}
  };
  const mainTabBtn=active=>({padding:"8px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:14,fontWeight:700,background:active?C.white:C.fir,color:active?C.fir:C.mist,transition:"all 0.2s",whiteSpace:"nowrap",boxShadow:active?"0 2px 8px rgba(0,0,0,0.15)":"none"});

  return(
    <div style={{minHeight:"100vh",background:C.cream}}>
      <div style={{background:C.fir}}>
        <div className="top-grid">
          <div className="top-cell" style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <Brand/>
            <PageSwitch current="job"/>
          </div>
          <div className="top-cell top-div-dark" style={{display:"flex",alignItems:"center"}}>
            <div className="tabscroll">
              <div style={{display:"flex",gap:4,background:"rgba(0,0,0,0.18)",borderRadius:24,padding:4,flexShrink:0}}>
                <button className="mtab" style={mainTabBtn(mainTab==="companies")} onClick={()=>setMainTab("companies")}>
                  公司关注
                  {companies.length>0&&<span style={{background:C.reed,color:C.white,borderRadius:12,padding:"1px 7px",fontSize:11,marginLeft:6,fontWeight:700}}>{companies.length}</span>}
                </button>
                <span style={{color:C.mist,fontSize:14,alignSelf:"center",padding:"0 2px"}}>›</span>
                <button className="mtab" style={mainTabBtn(mainTab==="toApply")} onClick={()=>setMainTab("toApply")}>
                  待投岗位
                  {toApply.length>0&&<span style={{background:C.reed,color:C.white,borderRadius:12,padding:"1px 7px",fontSize:11,marginLeft:6,fontWeight:700}}>{toApply.length}</span>}
                </button>
                <span style={{color:C.mist,fontSize:14,alignSelf:"center",padding:"0 2px"}}>›</span>
                <button className="mtab" style={mainTabBtn(mainTab==="tracker")} onClick={()=>setMainTab("tracker")}>
                  投递追踪
                  
                </button>
              </div>
            </div>
          </div>
          <div className="top-cell top-div-dark" style={{display:"flex",alignItems:"center"}}>
          {/* 操作按钮放在和下方日程同宽的容器里、按比例撑满，右边缘和日程对齐 */}
          <div className="hdr-actions" style={{display:"flex",gap:8,width:AGENDA_W}}>
            {mainTab==="events"&&<button onClick={()=>setActModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加活动</button>}
            {mainTab==="tracker"&&<>
              <button onClick={()=>setModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加投递</button>
              <button onClick={exportData} style={{background:"transparent",color:C.frost,border:`1px solid ${C.reed}`,borderRadius:10,padding:"9px 14px",cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>⬇ 导出</button>
              <label style={{background:"transparent",color:C.frost,border:`1px solid ${C.reed}`,borderRadius:10,padding:"9px 14px",cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>
                ⬆ 导入<input type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
              </label>
            </>}
            {mainTab==="toApply"&&<button onClick={()=>setTaModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加待投递</button>}
            {mainTab==="companies"&&<button onClick={()=>setCModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加关注公司</button>}
          </div>
          </div>
        </div>
      </div>
      {/* 浅色信息行：主题色的极淡斜细纹 */}
      <div style={{background:`repeating-linear-gradient(135deg, ${C.fir}0D 0 1px, transparent 1px 9px), ${C.white}`,borderBottom:`1px solid ${C.border}`}}>
        <div className="top-grid">
          <div className="top-cell">
            <DateTitle/>
            <Epigraph lines={["我们准备着深深地领受","那些意想不到的奇迹"]} by="冯至《十四行集》"/>
            <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
              <button onClick={toggleInbox} style={{background:C.white,color:C.textLight,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>
                📥 收件箱{inboxItems.length>0?` (${inboxItems.length})`:""}
              </button>
              <button onClick={()=>setReminderOpen(true)} title="提醒设置：邮件、日历订阅、同步状态"
              style={{background:remindWarn||remindHot?"#C0392B":C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              🔔 提醒{remindHot>0?` (${remindHot})`:""}{remindWarn?" ⚠️":""}
            </button>
            </div>
          </div>
          <div className="top-cell top-div-light" style={{borderLeft:`1px solid ${C.border}`,display:"flex",flexDirection:"column",justifyContent:"center"}}>
            <DayCount label="秋招" since={firstDate([...jobs.map(j=>j.date),...jobs.map(j=>j.id),...toApply.map(t=>t.id),...companies.map(c=>c.id)])}/>
            <StatList stats={[["已投递",total],["面试中",interviews],["已录用",offers]]}/>
          </div>
          <div className="top-cell top-div-light" style={{borderLeft:`1px solid ${C.border}`,display:"flex",gap:20,alignItems:"flex-start"}}>
          <div style={{width:AGENDA_W,flexShrink:0}}>
            <DayHeader events={reminderEvents}/>
            {/* 活动必定进入日程，所以入口放在日程上方 */}
            <button onClick={()=>setMainTab("events")} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"8px 12px",borderRadius:10,border:`1px solid ${mainTab==="events"?C.sage:C.border}`,background:mainTab==="events"?C.frost:C.cream,color:C.fir,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:12}}>
              <span>📅 活动{acts.length?` · ${acts.length}`:""}</span>
              <span style={{color:C.textLight,fontWeight:400,fontSize:12}}>查看全部 ›</span>
            </button>
            <AgendaPanel events={reminderEvents} target="job" onOpen={openFromAgenda}/>
          </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1240,margin:"0 auto",padding:"20px 14px"}}>

        {mainTab==="companies"&&(
          <div className="tab-content">
            {companies.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>
                <div style={{fontSize:36,marginBottom:12}}>🏢</div>
                <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无关注公司</div>
                <div style={{fontSize:13}}>可以在这里直接添加，也可以在添加岗位时勾选「同时加入关注公司」</div>
              </div>
            )}
            {companies.length>0&&[
              {label:"待筛选",icon:"🔍",color:C.sage,items:companiesNeedReview,isOpen:reviewOpen,setOpen:setReviewOpen,emptyText:"没有待筛选的公司了"},
              {label:"已有职位在跟进",icon:"✅",color:C.mist,items:companiesTracked,isOpen:trackedOpen,setOpen:setTrackedOpen,emptyText:"还没有公司进展到这一步"},
            ].map(group=>(
              <div key={group.label} style={{background:C.white,border:`1.5px solid ${C.border}`,borderRadius:14,overflow:"hidden",marginBottom:10}}>
                <div style={{height:4,background:group.color}}/>
                <div onClick={()=>group.setOpen(v=>!v)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:700,fontSize:14,color:C.fir}}>{group.icon} {group.label}</span>
                    <span style={{background:C.frost,color:C.moss,borderRadius:12,padding:"1px 9px",fontSize:12,fontWeight:700}}>{group.items.length}</span>
                  </div>
                  <span style={{color:C.mist,fontSize:13}}>{group.isOpen?"▲":"▼"}</span>
                </div>
                {group.isOpen&&(
                  <div className="tab-content" style={{padding:"0 16px 16px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
                    {group.items.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:C.mist,fontSize:12,padding:"14px 0"}}>{group.emptyText}</div>}
                    {group.items.map(({co,positions})=>(
                      <CompanyCard key={co.id} company={co} positions={positions}
                        onAddPosition={()=>setTaModal({...EMPTY_TOAPPLY,company:co.company,companyId:co.id})}
                        onEdit={()=>setCModal(co)}
                        onDel={()=>delCo(co.id)}/>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {mainTab==="toApply"&&(
          <div className="tab-content">
            {toApply.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>
                <div style={{fontSize:36,marginBottom:12}}>📌</div>
                <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无待投递职位</div>
                <div style={{fontSize:13}}>点击「添加待投递」先收藏感兴趣的职位</div>
              </div>
            )}
            {toApply.length>0&&(
              <div style={{display:"flex",gap:3,background:C.frost,borderRadius:24,padding:3,marginBottom:16,width:"fit-content"}}>
                {[
                  {key:"all",label:`全部 ${toApply.length}`},
                  {key:"计划投递",label:`计划投递 ${toApply.filter(t=>t.intent==="计划投递").length}`},
                  {key:"长期关注",label:`长期关注 ${toApply.filter(t=>t.intent==="长期关注").length}`},
                ].map(f=><button key={f.key} style={tabBtn(taFilter===f.key)} onClick={()=>setTaFilter(f.key)}>{f.label}</button>)}
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
              {[...toApply].filter(t=>taFilter==="all"||t.intent===taFilter).sort((a,b)=>{
                const pa=PRIORITY_ORDER[a.priority]??1,pb=PRIORITY_ORDER[b.priority]??1;
                if(pa!==pb) return pa-pb;
                if(!a.deadline&&!b.deadline) return 0;
                if(!a.deadline) return 1;
                if(!b.deadline) return -1;
                return a.deadline.localeCompare(b.deadline);
              }).map(item=>{
                const priorityColor={"高":"#b05050","中":C.moss,"低":C.mist};
                const today=new Date(); today.setHours(0,0,0,0);
                const ddlDate=item.deadline?new Date(item.deadline):null;
                const daysLeft=ddlDate?Math.ceil((ddlDate-today)/(1000*60*60*24)):null;
                const urgent=daysLeft!==null&&daysLeft<=3&&daysLeft>=0;
                const expired=daysLeft!==null&&daysLeft<0;
                return(
                  <ToApplyCard key={item.id} item={item} urgent={urgent} expired={expired} daysLeft={daysLeft}
                    priorityColor={priorityColor}
                    onPromote={()=>promoteTA(item)}
                    onEdit={()=>setTaModal(item)}
                    onDel={()=>delTA(item.id)}
                    onSnooze={()=>snoozeTA(item)}/>
                );
              })}
            </div>
          </div>
        )}

        {mainTab==="events"&&(
          <div className="tab-content">
            <ActivitiesTab acts={acts} context="job" onEdit={a=>setActModal(a)} onDel={delAct} onStatus={setActStatus}/>
          </div>
        )}

        {mainTab==="tracker"&&(<div className="tab-content">

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:3,background:C.frost,borderRadius:24,padding:3}}>
            {["看板","列表"].map(v=><button key={v} style={tabBtn(view===v)} onClick={()=>setView(v)}>{v}</button>)}
          </div>
          <select style={selStyle} value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">全部状态</option>
            {STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
          </select>
          <select style={selStyle} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
            <option value="all">全部类型</option>
            {TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>

        {view==="看板"&&(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {STATUS.map(col=>{
              const colJobs=jobs.filter(j=>j.status===col.key&&(typeFilter==="all"||j.type===typeFilter));
              const isOver=dragOver.current===col.key;
              const hasAny=jobs.some(j=>j.status===col.key);
              const isOpen=col.key in manualExpand?manualExpand[col.key]:hasAny;
              const dropHere=e=>{e.preventDefault();if(dragId)reorderJobs(dragId,null,col.key);setDragId(null);setDragOverCardId(null);dragOver.current=null;};
              return(
                <div key={col.key}
                  style={{background:C.white,border:`1.5px solid ${isOver?C.sage:C.border}`,borderRadius:14,overflow:"hidden",transition:"all 0.2s"}}>
                  <div style={{height:4,background:col.color}}/>
                  <div onClick={()=>setManualExpand(s=>({...s,[col.key]:!isOpen}))}
                    onDragOver={e=>{e.preventDefault();dragOver.current=col.key;}}
                    onDrop={dropHere}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",cursor:"pointer",background:isOver?C.frost:C.white}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontWeight:700,fontSize:14,color:col.color}}>{col.label}</span>
                      <span style={{background:col.bg,color:col.color,borderRadius:12,padding:"1px 9px",fontSize:12,fontWeight:700}}>{colJobs.length}</span>
                    </div>
                    <span style={{color:C.mist,fontSize:13}}>{isOpen?"▲":"▼"}</span>
                  </div>
                  {isOpen&&(
                    <div className="tab-content"
                      onDragOver={e=>{e.preventDefault();dragOver.current=col.key;}}
                      onDrop={dropHere}
                      style={{padding:"0 16px 16px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10,maxHeight:"60vh",overflowY:"auto"}}>
                      {colJobs.map(job=>(
                        <KanbanCard key={job.id} job={job}
                          onEdit={()=>setModal(job)} onDel={()=>del(job.id)}
                          isDragging={dragId===job.id}
                          isDropTarget={dragOverCardId===job.id&&dragId&&dragId!==job.id}
                          isRejected={job.status==="rejected"}
                          onDragStart={()=>setDragId(job.id)}
                          onDragEnd={()=>{setDragId(null);setDragOverCardId(null);}}
                          onCardDragOver={()=>{if(dragId&&dragId!==job.id)setDragOverCardId(job.id);}}
                          onDropBefore={()=>{if(dragId&&dragId!==job.id)reorderJobs(dragId,job.id,col.key);setDragId(null);setDragOverCardId(null);dragOver.current=null;}}/>
                      ))}
                      {colJobs.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:C.mist,fontSize:12,padding:"18px 0",borderRadius:8,border:`1.5px dashed ${C.border}`}}>拖拽到此处</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {view==="列表"&&(
          <div style={{background:C.white,borderRadius:14,border:`1px solid ${C.border}`,overflow:"auto",boxShadow:`0 2px 12px ${C.shadow}`}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:700}}>
              <thead>
                <tr style={{background:C.fir,color:C.frost}}>
                  {["公司","职位","类型","状态","投递日期","最新环节","来源","备注","操作"].map(h=>(
                    <th key={h} style={{padding:"11px 12px",textAlign:"left",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.length===0&&<tr><td colSpan={9} style={{textAlign:"center",padding:32,color:C.mist}}>暂无投递记录</td></tr>}
                {filtered.map((job,i)=>{
                  const ms=job.milestones||[];
                  const latest=ms.length>0?ms[ms.length-1]:null;
                  return(
                    <tr key={job.id} style={{background:i%2===0?C.cream:C.white,borderBottom:`1px solid ${C.border}`}}>
                      <td style={{padding:"9px 12px",fontWeight:700,color:C.fir,maxWidth:120,wordBreak:"break-word"}}>
                        {job.url?<a href={job.url} title={job.url} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{job.company} ↗</a>:job.company}
                      </td>
                      <td style={{padding:"9px 12px",maxWidth:150,wordBreak:"break-word"}}>{job.position}</td>
                      <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><TypeTag t={job.type}/>{(!job.type||job.type==="全职")&&<span style={{color:C.mist,fontSize:12}}>全职</span>}</td>
                      <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><Badge s={job.status}/></td>
                      <td style={{padding:"9px 12px",color:C.textLight,whiteSpace:"nowrap"}}>{job.date}</td>
                      <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                        {latest?<span style={{fontSize:12,color:C.sage,fontWeight:600}}>{latest.stage}<span style={{color:C.mist,fontWeight:400}}> · {latest.date}</span></span>:<span style={{color:C.mist,fontSize:12}}>—</span>}
                      </td>
                      <td style={{padding:"9px 12px",color:C.textLight,whiteSpace:"nowrap"}}>{job.source}</td>
                      <td style={{padding:"9px 12px",color:C.textLight,fontStyle:"italic",maxWidth:110,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{job.note||"—"}</td>
                      <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                        <div style={{display:"flex",gap:5}}>
                          <button onClick={()=>setModal(job)} style={{padding:"3px 9px",borderRadius:6,border:`1px solid ${C.border}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>编辑</button>
                          <button onClick={()=>del(job.id)} style={{padding:"3px 9px",borderRadius:6,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:11,cursor:"pointer"}}>删除</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        </div>)}
      </div>

      <Modal open={!!modal} onClose={()=>setModal(null)}>
        <JobForm initial={modal==="add"?null:modal} companies={companies} jobs={jobs} toApply={toApply} onSave={save} onCancel={()=>setModal(null)}/>
      </Modal>
      <Modal open={!!taModal} onClose={()=>setTaModal(false)}>
        <ToApplyForm initial={taModal==="add"?null:taModal} companies={companies} jobs={jobs} toApply={toApply} onSave={saveTA} onCancel={()=>setTaModal(false)}/>
      </Modal>
      <Modal open={!!cModal} onClose={closeCModal}>
        <CompanyForm initial={cModal==="add"?null:cModal} onSave={saveCo} onCancel={closeCModal}/>
      </Modal>
      <Modal open={!!actModal} onClose={closeActModal}>
        <ActivityForm key={actModal&&actModal.id?actModal.id:"new"} initial={actModal==="add"?null:actModal} context="job" companies={companies} onSave={saveAct} onCancel={closeActModal}/>
      </Modal>
      <Modal open={reminderOpen} onClose={()=>setReminderOpen(false)}>
        <ReminderPanel events={reminderEvents} sync={reminderSync} resync={resyncReminders}/>
      </Modal>
      <Modal open={inboxOpen} onClose={()=>setInboxOpen(false)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{color:C.fir,fontSize:17}}>📥 收件箱</h3>
          <button onClick={resetInboxKey} style={{background:"none",border:"none",color:C.textLight,fontSize:11,cursor:"pointer",textDecoration:"underline"}}>🔑 重设密钥</button>
        </div>
        {inboxLoading&&<div style={{fontSize:12,color:C.textLight,textAlign:"center",padding:"12px 0"}}>加载中…</div>}
        {!inboxLoading&&inboxError&&<div style={{fontSize:12,color:"#b05050",textAlign:"center",padding:"12px 0"}}>{inboxError}</div>}
        {!inboxLoading&&!inboxError&&inboxItems.length===0&&<div style={{fontSize:12,color:C.mist,textAlign:"center",padding:"12px 0"}}>收件箱是空的</div>}
        {!inboxLoading&&!inboxError&&inboxItems.map(item=>{
          const ext=inboxExtractions[item.id];
          const lines=[...new Set(item.content.split("\n").map(l=>l.trim()).filter(Boolean))];
          const isEvent=item.kind==="event";
          const isList=!isEvent&&lines.length>1;
          return(
          <div key={item.id} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",marginBottom:8}}>
            <div style={{fontSize:12,color:C.text,wordBreak:"break-word",whiteSpace:"pre-wrap",marginBottom:6}}>
              {item.type==="url"
                ?<a href={item.content} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{item.content}</a>
                :item.content}
            </div>
            {isList&&<div style={{fontSize:11,color:C.moss,marginBottom:6}}>看起来是一份清单（{lines.length}行）</div>}
            {!isList&&ext&&ext.loading&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>🔍 识别中…</div>}
            {isEvent&&ext&&!ext.loading&&!ext.error&&<div style={{fontSize:11,color:ext.title?C.sage:C.mist,fontWeight:ext.title?600:400,marginBottom:6}}>
              {ext.title?`📅 推测：${ext.title}${ext.date?` · ${ext.date}`:""}${ext.time?` ${ext.time} ${tzLabel(ext.timezone)}`:""}`:"未识别出活动信息"}
            </div>}
            {!isEvent&&!isList&&ext&&!ext.loading&&!ext.error&&ext.company&&<div style={{fontSize:11,color:C.sage,fontWeight:600,marginBottom:6}}>推测：{ext.company}{ext.industry?` · ${ext.industry}`:""}</div>}
            {!isEvent&&!isList&&ext&&!ext.loading&&!ext.error&&!ext.company&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>未识别出公司信息</div>}
            <div style={{fontSize:10,color:C.mist,marginBottom:6}}>{new Date(item.createdAt).toLocaleString()}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {isEvent?(
                <button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{flex:1,minWidth:90,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成活动"}
                </button>
              ):<>
                <button onClick={()=>convertInboxItem(item)} disabled={convertingId===item.id}
                  style={{flex:1,minWidth:90,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成关注公司"}
                </button>
                {!isList&&<button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${C.sage}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>转成活动</button>}
              </>}
              {isList&&(
                <button onClick={()=>batchSplitInboxItem(item,lines)}
                  style={{flex:1,minWidth:90,padding:"5px 0",borderRadius:6,border:`1px solid ${C.sage}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>
                  批量拆分成{lines.length}个
                </button>
              )}
              <button onClick={()=>ignoreInboxItem(item)} style={{padding:"5px 10px",borderRadius:6,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:11,cursor:"pointer"}}>忽略</button>
            </div>
          </div>
          );
        })}
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
