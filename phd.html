<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>在路上 · 申博</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* 英文字体排在前面：英文用 Calibri / Times New Roman，中文自动落到后面的黑体 / 宋体 */
body{font-family:Calibri,'SimHei','黑体','Heiti SC','STHeiti',sans-serif;background:#F1F4F9;color:#1C2433;}
/* 按钮、输入框默认用系统控件字体，统一改成继承页面字体：全页只有这一套无衬线体 + 标题用的 SERIF */
button,input,select,textarea{font-family:inherit;}
/* 深色导航行整行用宋体系衬线体（和 JS 里的 SERIF 一致）：名字、切换、流程标签、操作按钮、账号 */
.nav-serif{font-family:'Times New Roman','Noto Serif SC','Source Han Serif SC','Songti SC','STZhongsong','STSong','SimSun',serif;}
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #5A7BA6;outline-offset:1px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#F1F4F9;}
::-webkit-scrollbar-thumb{background:#A9BCD6;border-radius:3px;}
.card:hover{box-shadow:0 4px 16px rgba(43,58,85,0.2)!important;}

/* Button press effect */
button{transition:transform 0.1s,box-shadow 0.1s,background 0.15s!important;}
button:hover:not(:disabled){transform:scale(0.97);}
button:active:not(:disabled){transform:scale(0.95);}

/* Modal animations */
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-backdrop{animation:backdropIn 0.2s ease}
.modal-box{animation:modalIn 0.22s cubic-bezier(0.34,1.56,0.64,1)}

/* Tab fade */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab-content{animation:fadeIn 0.18s ease}

/* Collapsible slide */
.collapsible{overflow:hidden;transition:max-height 0.22s cubic-bezier(0.4,0,0.2,1),opacity 0.18s ease;}
.collapsible.open{max-height:600px;opacity:1;}
.collapsible.closed{max-height:0;opacity:0;}

/* Header / agenda layout, incl. narrow screens */
.hdr{padding:12px 24px;}
.tabscroll{overflow-x:auto;scrollbar-width:none;max-width:100%;}
.tabscroll::-webkit-scrollbar{display:none;}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:640px){
  .hdr{padding:10px 12px;}
  .mtab{padding:6px 12px!important;font-size:13px!important;}
  .hdr-actions button,.hdr-actions label{padding:7px 12px!important;font-size:13px!important;}
  .agenda-grid{grid-template-columns:1fr;gap:12px;}
}

/* Top panel: dark nav row + light info row, three aligned columns */
/* 和秋招页同样的栏宽，两页切换时三栏分隔线位置一致 */
.top-grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:400px 390px minmax(0,1fr);}
.top-cell{padding:14px 20px;min-width:0;}
.top-div-dark{border-left:1px solid rgba(255,255,255,0.16);}
.hdr-actions>*{flex:1 1 auto;text-align:center;}
.wf-tabs>.mtab{flex:1 1 auto;}
@media (max-width:1100px){
  .top-grid{grid-template-columns:1fr;}
  .art-day{display:none!important;}
  .top-div-dark,.top-div-light{border-left:none!important;}
  .top-cell{padding:10px 14px;}
}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
// 申博页用墨蓝色调，和秋招页的森林绿区分开；状态标签颜色两边保持一致
const C={
  fir:"#2B3A55",moss:"#34496B",sage:"#5A7BA6",reed:"#7E9CC4",
  mist:"#A9BCD6",frost:"#DCE5F2",cream:"#F1F4F9",white:"#FFFFFF",
  text:"#1C2433",textLight:"#4A5A73",border:"#C3D0E3",shadow:"rgba(43,58,85,0.12)"
};
const PROF_STATUS=[
  {key:"pending", label:"待发送", color:"#6B6B6B",bg:"#ECECEC"},
  {key:"sent",    label:"已发送", color:"#5C7A60",bg:"#E8F2E8"},
  {key:"followed",label:"已跟进", color:"#5E5A7A",bg:"#E8E6F2"},
  {key:"replied", label:"已回复", color:"#7A6E2F",bg:"#F5F2DC"},
  {key:"talked",  label:"已约谈", color:"#2F5A7A",bg:"#DCF0F5"},
  {key:"success", label:"成功",   color:"#2F6640",bg:"#D4EDD8"},
  {key:"failed",  label:"未成功", color:"#7A3030",bg:"#F5DCDC"},
];
const APP_STATUS=[
  {key:"prep",      label:"材料准备中",  color:"#6B6B6B",bg:"#ECECEC"},
  {key:"submitted", label:"已提交",     color:"#5C7A60",bg:"#E8F2E8"},
  {key:"review",    label:"审核/面试中", color:"#2F5A7A",bg:"#DCF0F5"},
  {key:"admitted",  label:"已录取",     color:"#2F6640",bg:"#D4EDD8"},
  {key:"waitlist",  label:"Waitlist",  color:"#7A6E2F",bg:"#F5F2DC"},
  {key:"rejected",  label:"未录取",     color:"#7A3030",bg:"#F5DCDC"},
];
const EMPTY_PROF={name:"",institution:"",researchAreas:[],status:"pending",sentDate:"",followedDate:"",url:"",note:"",applicationIds:[],contacts:[]};
const EMPTY_APP={school:"",program:"",cycle:"",deadline:"",rolling:false,status:"prep",url:"",note:""};

const inp={width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:14,color:C.text,background:C.cream};
const lbl={fontSize:12,color:C.textLight,marginBottom:4,display:"block",fontWeight:600};

const URL_RE=/(https?:\/\/[^\s<>"'）】」』，。！？；：]+)/g;
function linkifyText(text){
  if(!text) return text;
  return String(text).split(URL_RE).map((part,i)=>
    /^https?:\/\//.test(part)
      ?<a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:C.fir,wordBreak:"break-all"}} onClick={e=>e.stopPropagation()}>{part}</a>
      :part
  );
}

// ---------- 提醒（每日邮件 + 日历订阅），与 index.html 保持一致 ----------
const pad2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const diffDays=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
const isDue=(e,today)=>e.remindOn.includes(today)||(e.repeatUntilDone&&today>=e.date);
const dueLabel=(date,today)=>{const d=diffDays(today,date);return d===0?"今天":d===1?"明天":d>1?`还有 ${d} 天`:`已逾期 ${-d} 天`;};
const getKey=()=>{try{return localStorage.getItem("jt4_inbox_key")||""}catch{return ""}};

// ---------- 账号：邀请码注册 + 用户名密码登录，与 index.html / phd.html 保持一致 ----------
// 登录后服务器发的令牌和旧的收件箱密钥存在同一个位置（jt4_inbox_key），所有云端接口都靠它认人。
const setKey=k=>{try{k?localStorage.setItem("jt4_inbox_key",k):localStorage.removeItem("jt4_inbox_key")}catch{}};
async function accountCall(action,payload={}){
  const res=await fetch("/api/account",{method:"POST",headers:{"Content-Type":"application/json","X-Inbox-Key":getKey()},body:JSON.stringify({action,...payload})});
  const d=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error(d.error||"请求失败，检查网络");e.status=res.status;throw e;}
  return d;
}
// ---------- 本地记录按账号分开，与 index.html / phd.html 保持一致 ----------
// 投递、套磁等记录只存在浏览器里。登录后键名加 "u:用户名:" 前缀，同一个浏览器上不同账号各看各的；
// 未登录或用旧密钥时用原来的键名。当前账号记在 jt4_user，切换账号后整页刷新。
const LS_USER=(()=>{try{return localStorage.getItem("jt4_user")||""}catch{return ""}})();
const lsKey=k=>LS_USER?`u:${LS_USER}:${k}`:k;
const LOCAL_DATA_KEYS=["jt4","jt4_toApply","jt4_companies","jt4_events","jt4_rolling_remind_init","backup_at_job","agenda_job",
  "phd_professors","phd_applications","phd_research_tags","phd_events","backup_at_phd","agenda_phd","jt4_deepseek_key"];
const LOCAL_RECORD_KEYS=["jt4","jt4_toApply","jt4_companies","jt4_events","phd_professors","phd_applications","phd_events"];
// 第一次登录某个账号、而浏览器里有未登录时记的数据：问一次要不要把它们移到这个账号下
function claimLocalData(name){
  try{
    const unowned=LOCAL_RECORD_KEYS.some(k=>{const v=localStorage.getItem(k);return v&&v!=="[]";});
    const mine=LOCAL_DATA_KEYS.some(k=>localStorage.getItem(`u:${name}:${k}`)!=null);
    if(!unowned||mine) return;
    if(!confirm(`这个浏览器里有未登录时记下的投递 / 套磁记录。\n要把它们归到账号「${name}」下吗？\n\n确定：记录移到这个账号，退出登录后就看不到了。\n取消：这个账号从空白开始，原记录留在未登录状态下。`)) return;
    LOCAL_DATA_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null){localStorage.setItem(`u:${name}:${k}`,v);localStorage.removeItem(k);}});
  }catch{}
}
function switchLocalUser(name){
  if(name) claimLocalData(name);
  try{name?localStorage.setItem("jt4_user",name):localStorage.removeItem("jt4_user")}catch{}
  location.reload();
}
// 页面打开时核对：浏览器里的登录身份和本地记录所属账号不一致（比如这个功能上线前就登录了），就切过去
async function syncLocalUser(){
  if(!getKey()){if(LS_USER) switchLocalUser("");return;}
  try{
    const {user}=await accountCall("me");
    const want=user.legacy?"":user.name;
    if(want!==LS_USER) switchLocalUser(want);
  }catch{}
}
function AccountBox({me,onAuth,smallBtn}){
  const [mode,setMode]=useState("login");
  const [f,setF]=useState({username:"",password:"",code:""});
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  if(me) return(
    <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.text}}>
      <span style={{flex:1}}>👤 <b>{me.name}</b>{me.owner&&<span style={{color:C.textLight,fontSize:12}}> · 站长</span>}{me.legacy&&<span style={{color:C.textLight,fontSize:12}}> · 正在用旧密钥，建议退出后登录账号</span>}</span>
      <button onClick={async()=>{try{await accountCall("logout")}catch{} onAuth("");}} style={smallBtn}>退出</button>
    </div>
  );
  const submit=async e=>{
    e.preventDefault();setBusy(true);setErr("");
    try{const d=await accountCall(mode,f);onAuth(d.token,d.user.name);}catch(x){setErr(x.message);}
    setBusy(false);
  };
  const tab=on=>({...smallBtn,...(on?{background:C.sage,color:C.white,border:"none"}:{})});
  return(
    <form onSubmit={submit} style={{background:C.cream,border:`1px solid ${C.border}`,borderRadius:10,padding:12}}>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <button type="button" onClick={()=>setMode("login")} style={tab(mode==="login")}>登录</button>
        <button type="button" onClick={()=>setMode("register")} style={tab(mode==="register")}>用邀请码注册</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <input value={f.username} onChange={e=>setF({...f,username:e.target.value})} placeholder="用户名" autoComplete="username" style={{...inp,background:C.white}}/>
        <input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} placeholder={mode==="register"?"密码（至少 6 位）":"密码"} autoComplete={mode==="register"?"new-password":"current-password"} style={{...inp,background:C.white}}/>
        {mode==="register"&&<input value={f.code} onChange={e=>setF({...f,code:e.target.value})} placeholder="邀请码（向站长要）" autoComplete="off" style={{...inp,background:C.white}}/>}
        <button type="submit" disabled={busy} style={{...smallBtn,background:C.sage,color:C.white,border:"none",padding:"8px 12px"}}>{busy?"请稍候…":mode==="login"?"登录":"注册并登录"}</button>
        {err&&<div style={{fontSize:12,color:"#b05050"}}>⚠️ {err}</div>}
      </div>
      <div style={{fontSize:11,color:C.textLight,lineHeight:1.6,marginTop:8}}>登录后才能用收件箱、提醒邮件和日历订阅。投递 / 套磁记录仍然只存在这个浏览器里，不会上传。</div>
    </form>
  );
}
// 每日邮件：每个人用自己的 Resend 账号发给自己（没有自己的域名时，Resend 只能发到注册它的邮箱）
function MailSettings({me,smallBtn}){
  const [s,setS]=useState(null);
  const [editing,setEditing]=useState(false);
  const [email,setEmail]=useState("");
  const [rk,setRk]=useState("");
  const [msg,setMsg]=useState("");
  useEffect(()=>{accountCall("settings-get").then(d=>{setS(d);setEmail(d.email);setEditing(!(d.email&&d.resendHint));}).catch(()=>{});},[me?.name]);
  if(!s) return null;
  const save=async()=>{
    setMsg("保存中…");
    try{const d=await accountCall("settings-set",{email,resendKey:rk});setS(x=>({...x,...d}));setRk("");setEditing(false);setMsg("✅ 已保存，点下面「发一封测试邮件」试试");}
    catch(e){setMsg("⚠️ "+e.message);}
  };
  const box={background:C.cream,border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginBottom:10,fontSize:12,color:C.textLight,lineHeight:1.7};
  const msgEl=msg&&<div style={{color:msg.startsWith("⚠️")?"#b05050":C.sage}}>{msg}</div>;
  if(!editing) return(
    <div style={box}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{flex:1}}>{s.resendHint?<>发到 <b style={{color:C.text}}>{s.email}</b> · Resend key {s.resendHint}</>:"使用部署环境变量里的 Resend 设置"}</span>
        <button onClick={()=>setEditing(true)} style={smallBtn}>修改</button>
      </div>
      {msgEl}
    </div>
  );
  return(
    <div style={box}>
      {s.envFallback&&!s.resendHint&&<div style={{marginBottom:6}}>现在用的是部署环境变量里的 Resend 设置；在这里填了就以这里为准。</div>}
      <ol style={{paddingLeft:18,margin:"0 0 8px"}}>
        <li>打开 <a href="https://resend.com/signup" target="_blank" rel="noopener noreferrer" style={{color:C.sage}}>resend.com</a>，<b>用你想收提醒的邮箱</b>注册（只能发到这个邮箱）</li>
        <li>在 API Keys 里新建一个 key，名字随便填，权限选 <b>Sending access</b></li>
        <li>把 key 和邮箱填在下面、保存，再点「发一封测试邮件」，收到就说明成功了</li>
      </ol>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="收信邮箱（= 注册 Resend 的邮箱）" autoComplete="email" style={{...inp,background:C.white}}/>
        <input type="password" value={rk} onChange={e=>setRk(e.target.value)} placeholder={s.resendHint?`已保存 ${s.resendHint}，留空则不改`:"Resend key（re_ 开头）"} autoComplete="off" style={{...inp,background:C.white}}/>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={save} style={{...smallBtn,background:C.sage,color:C.white,border:"none"}}>保存</button>
          {(s.resendHint||s.envFallback)&&<button onClick={()=>{setEditing(false);setMsg("");}} style={smallBtn}>取消</button>}
        </div>
        {msgEl}
      </div>
      <div style={{marginTop:8,fontSize:11}}>key 会加密保存在服务器上，用来每天替你发信。不想用了可以随时在 Resend 后台删除它。</div>
    </div>
  );
}
// 自动填写（AI）：浏览器里存了自己的 DeepSeek key 就用它；否则用登录身份走系统额度（站长开通，每天有上限）
const getAiKey=()=>{try{return localStorage.getItem(lsKey("jt4_deepseek_key"))||""}catch{return ""}};
const aiHeaders=()=>({"Content-Type":"application/json","X-Inbox-Key":getKey(),...(getAiKey()?{"X-DeepSeek-Key":getAiKey()}:{})});
const isAiGateMsg=m=>/自动填写|DeepSeek|系统额度/.test(m||"");
const aiFailMsg=e=>isAiGateMsg(e?.message)?"⚠️ "+e.message:"⚠️ 提取失败，请手动填写";
function AiSettings({me,smallBtn,section}){
  const [own,setOwn]=useState(getAiKey);
  const [input,setInput]=useState("");
  const save=()=>{const k=input.trim();if(!k)return;try{localStorage.setItem(lsKey("jt4_deepseek_key"),k)}catch{} setOwn(k);setInput("");};
  const clear=()=>{try{localStorage.removeItem(lsKey("jt4_deepseek_key"))}catch{} setOwn("");};
  const status=own?<>使用你自己的 DeepSeek key（{own.slice(0,5)}…{own.slice(-4)}），只存在这个浏览器里</>
    :me?.owner?"站长：使用系统额度，不限次数"
    :me?.aiAllowed?`使用系统额度，每天最多 ${me.aiLimit} 次`
    :me?"系统额度还没为你开通。可以找站长开通，或者填自己的 DeepSeek key："
    :"登录后可使用站长开通的系统额度，或者直接填自己的 DeepSeek key：";
  return(
    <>
      <div style={section}>✨ 自动填写（AI）</div>
      <div style={{fontSize:12,color:C.textLight,lineHeight:1.7}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{flex:1}}>{status}</span>{own&&<button onClick={clear} style={smallBtn}>清除</button>}</div>
        {!own&&<div style={{display:"flex",gap:8,marginTop:6}}>
          <input type="password" value={input} onChange={e=>setInput(e.target.value)} placeholder="自己的 DeepSeek key（sk- 开头，可选）" autoComplete="off" style={{...inp,fontSize:12,flex:1}}/>
          <button onClick={save} style={smallBtn}>保存</button>
        </div>}
        {!own&&<div style={{fontSize:11,marginTop:4}}>在 <a href="https://platform.deepseek.com" target="_blank" rel="noopener noreferrer" style={{color:C.sage}}>DeepSeek 开放平台</a> 注册、充值后创建 API key。key 只保存在这个浏览器里，每次自动填写时直接转交给 DeepSeek，不会存到服务器。</div>}
      </div>
    </>
  );
}
// 站长：生成 / 作废邀请码，看有哪些用户
function AdminBox({smallBtn}){
  const [data,setData]=useState(null);
  const [msg,setMsg]=useState("");
  const load=()=>accountCall("admin-list").then(setData).catch(e=>setMsg("⚠️ "+e.message));
  const create=async()=>{try{const {code}=await accountCall("invite-create");setMsg(`新邀请码：${code}（每个只能用一次）`);load();}catch(e){setMsg("⚠️ "+e.message);}};
  const del=async code=>{try{await accountCall("invite-delete",{code});load();}catch(e){setMsg("⚠️ "+e.message);}};
  const toggleAi=async u=>{try{await accountCall("user-ai",{username:u.name,allowed:!u.aiAllowed});load();}catch(e){setMsg("⚠️ "+e.message);}};
  return(
    <details onToggle={e=>e.target.open&&!data&&load()} style={{marginTop:10,fontSize:12,color:C.textLight}}>
      <summary style={{cursor:"pointer"}}>🔑 站长：邀请码与用户</summary>
      <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={create} style={smallBtn}>生成邀请码</button>
          {msg&&<span style={{color:msg.startsWith("⚠️")?"#b05050":C.sage,userSelect:"all"}}>{msg}</span>}
        </div>
        {data&&<>
          <div>未使用的邀请码：{data.invites.length?data.invites.map(c=><span key={c} style={{display:"inline-flex",gap:4,alignItems:"center",marginRight:10}}><code style={{userSelect:"all"}}>{c}</code><span onClick={()=>del(c)} title="作废" style={{cursor:"pointer",color:"#b05050"}}>×</span></span>):"无"}</div>
          <div>用户（{data.users.length}）：</div>
          {data.users.map(u=><div key={u.name} style={{display:"flex",alignItems:"center",gap:8,paddingLeft:8}}>

const BACKUP_NAME={job:"秋招",phd:"申博"};
function downloadBackup(page,data){
  const payload={app:"在路上",page,exportedAt:new Date().toISOString(),...data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`在路上-${BACKUP_NAME[page]}备份-${todayStr()}.json`;
  a.click();URL.revokeObjectURL(a.href);
  const day=todayStr();
  try{localStorage.setItem(lsKey("backup_at_"+page),day)}catch{}
  return day;
}
const getBackupAt=page=>{try{return localStorage.getItem(lsKey("backup_at_"+page))||""}catch{return ""}};
// 数据只在本机浏览器里：有数据但从没备份、或距上次备份满 BACKUP_REMIND_DAYS 天时，在备份按钮下提示一行
const BACKUP_REMIND_DAYS=14;
function BackupHint({at,hasData,onBackup}){
  if(!hasData) return null;
  const days=at?diffDays(at,todayStr()):null;
  if(days!=null&&days<BACKUP_REMIND_DAYS) return null;
  return <div style={{fontSize:11,color:C.textLight,marginTop:8}}>
    {days==null?"记录只存在这个浏览器里，还没备份过":`已经 ${days} 天没备份了`} · <span onClick={onBackup} style={{color:C.sage,cursor:"pointer",textDecoration:"underline",whiteSpace:"nowrap"}}>现在备份</span>
  </div>;
}
function readBackup(e,page,onData){
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    let raw;try{raw=JSON.parse(ev.target.result)}catch{alert("⚠️ 文件格式有误");return;}
    if(raw&&raw.page&&raw.page!==page){const n=BACKUP_NAME[raw.page]||"另一个";alert(`这是${n}页的备份，请到${n}页导入`);return;}
    onData(raw);
  };
  r.readAsText(file);
}
// parts: [字段名, 显示名, 当前列表, setter, migrate, 取 id（默认 x.id）]
function mergeBackup(raw,parts){
  const plan=parts.map(([k,label,cur,set,mig,idOf=x=>x.id])=>{
    const incoming=(Array.isArray(raw?.[k])?raw[k]:[]).map(mig);
    const ids=new Set(cur.map(idOf));
    return {label,set,incoming,fresh:incoming.filter(x=>!ids.has(idOf(x)))};
  });
  if(!plan.some(p=>p.incoming.length)){alert("⚠️ 文件里没有可导入的数据");return;}
  const summary=plan.filter(p=>p.fresh.length).map(p=>`${p.label} ${p.fresh.length} 条`).join("、");
  if(!summary){alert("文件里的记录都已存在，不需要导入");return;}
  if(!confirm(`将新增：${summary}。\n已有的记录保持不变，确认导入？`))return;
  plan.forEach(p=>p.fresh.length&&p.set(prev=>[...prev,...p.fresh]));
  alert(`✅ 导入成功：${summary}`);
}

// Push this page's reminders to the cloud (debounced) so the daily email / calendar feed can see them.
function useReminderSync(target,events){
  const [sync,setSync]=useState({state:"idle"});
  const json=JSON.stringify(events);
  const run=async()=>{
    const key=getKey();
    if(!key){setSync({state:"nokey"});return;}
    setSync(s=>({...s,state:"syncing"}));
    try{
      const res=await fetch("/api/reminders-sync",{method:"POST",headers:{"Content-Type":"application/json","X-Inbox-Key":key},body:JSON.stringify({target,events:JSON.parse(json)})});
      if(res.status===401){setSync({state:"badkey"});return;}
      const data=await res.json();
      if(!res.ok) throw new Error(data.error);
      setSync({state:"ok",count:data.count});
    }catch{setSync({state:"error"});}
  };
  useEffect(()=>{const t=setTimeout(run,1500);return()=>clearTimeout(t);},[json]);
  // 本地缓存一份，给另一个页面的日程卡片读
  useEffect(()=>{try{localStorage.setItem(lsKey("agenda_"+target),json)}catch{}},[json]);
  return [sync,run];
}

function ArtOfDay({terms,target}){
  useClock();
  const today=todayStr();
  const day=Math.floor(Date.parse(today+"T00:00:00Z")/86400000);
  const key="art_of_day_"+target;
  const [cache,setCache]=useState(()=>{try{return JSON.parse(localStorage.getItem(key)||"null")}catch{return null}});
  const [open,setOpen]=useState(false);
  const [hover,setHover]=useState(false);
  const [broken,setBroken]=useState(false);
  useEffect(()=>{
    if(cache&&cache.day===today) return;
    let alive=true;
    const fields="id,title,creators,creation_date,technique,description,wall_description,images,url";
    // 当天的主题词搜不到合适的画，就顺延到下一个词，最多试 3 个
    const tryTerm=k=>{
      if(k>=3) return;
      const term=terms[(day+k)%terms.length];
      fetch(`https://openaccess-api.clevelandart.org/api/artworks/?title=${encodeURIComponent(term)}&type=Painting&has_image=1&cc0=1&limit=100&fields=${fields}`)
      .then(r=>r.json())
      .then(j=>{
        if(!alive) return;
        // 去掉细长卷轴、手抄本插页这类在小框里看不清的
        const list=(j.data||[]).filter(d=>{
          const w=d.images&&d.images.web;
          if(!w||!w.url||ART_SKIP.test(d.title||"")||/\bfrom (a|an|the)\b/i.test(d.title||"")||/opaque watercolor/i.test(d.technique||"")) return false;
          const r=Number(w.height)/Number(w.width);
          return r>=0.45&&r<=1.8;
        });
        if(!list.length){tryTerm(k+1);return;}
        const d=list[(Math.floor(day/terms.length)*7+day)%list.length];
        const art={id:d.id,title:d.title,artist:artistName(d.creators&&d.creators[0]&&d.creators[0].description),date:d.creation_date||"",
          technique:d.technique||"",about:stripHtml(d.wall_description||d.description),img:d.images.web.url,page:d.url||""};
        const next={day:today,art};
        setCache(next); setBroken(false);
        try{localStorage.setItem(key,JSON.stringify(next))}catch{}
      })
      .catch(()=>{});
    };
    tryTerm(0);
    return()=>{alive=false;};
  },[today]);
  const art=cache&&cache.art;
  if(!art||broken) return null;
  return(
    <div style={{position:"relative",display:"inline-block",maxWidth:"100%"}} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}>
      <img src={art.img} alt={art.title} onClick={()=>setOpen(true)} onError={()=>setBroken(true)}
        style={{display:"block",maxWidth:"100%",maxHeight:170,objectFit:"contain",cursor:"zoom-in",background:C.white,border:`1px solid ${C.border}`,padding:3,boxShadow:`0 2px 8px ${C.shadow}`}}/>
      {hover&&!open&&(
        // 画在左栏，资料卡出现在图片右侧（浮在中栏上方），避免被屏幕左边缘截掉
        <div style={{position:"absolute",left:"calc(100% + 12px)",top:"50%",transform:"translateY(-50%)",width:280,background:C.white,border:`1px solid ${C.border}`,borderRadius:10,boxShadow:`0 8px 24px ${C.shadow}`,padding:"12px 14px",zIndex:50,textAlign:"left",pointerEvents:"none"}}>
          <div style={{fontFamily:SERIF,fontSize:14,fontStyle:"italic",color:C.fir,lineHeight:1.4}}>{art.title}</div>
          <div style={{fontSize:12,color:C.textLight,marginTop:3}}>{[art.artist||"Unknown",art.date].filter(Boolean).join(" · ")}</div>
          <div style={{fontSize:12,color:C.text,marginTop:8,lineHeight:1.6,display:"-webkit-box",WebkitLineClamp:7,WebkitBoxOrient:"vertical",overflow:"hidden"}}>

function AgendaPanel({events,target,onOpen}){

  let otherEvents=[];
  try{otherEvents=JSON.parse(localStorage.getItem(lsKey("agenda_"+other))||"[]")}catch{}
  const all=[...events.map(e=>({...e,mine:true})),...otherEvents.map(e=>({...e,mine:false}))]
    .sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));

  const render=(list,nearCol,limit)=>{

    const rows=lines(list).map(l=>{
      if(!l.e){
        const one=l.items.length===1?l.items[0]:null;

              <span style={{wordBreak:"break-word"}}>
                <span style={{border:`1px solid ${C.border}`,borderRadius:4,padding:"0 4px",marginRight:5}}>{otherLabel}</span>
                {one?label(one):`${l.items.length} 项 ${open?"▲":"▼"}`}
              </span>
            </div>
            {!one&&open&&(
              <div style={{paddingLeft:70,marginTop:2}}>
                {l.items.map(it=><div key={it.id} style={{padding:"1px 0",wordBreak:"break-word"}}>{label(it)}</div>)}
              </div>
            )}
          </div>
        );
      }
      const e=l.e;
      if(limit&&shown>=limit){hidden++;return null;}
      shown++;
      const time=e.time?` ${e.time}${e.endTime?`–${e.endTime}`:""}`:"";
      return(
        <div key={e.id} onClick={()=>onOpen(e)} title={e.detail||"点击打开"} style={{display:"flex",gap:8,fontSize:13,padding:"4px 6px",margin:"0 -6px",borderRadius:7,cursor:"pointer"}}
          onMouseOver={ev=>ev.currentTarget.style.background=C.cream} onMouseOut={ev=>ev.currentTarget.style.background="transparent"}>
          <span style={{width:62,flexShrink:0,fontSize:12,fontWeight:700,color:e.date<=today?"#c0392b":C.textLight}}>{whenOf(e.date,nearCol)}</span>
          <span style={{color:C.text,wordBreak:"break-word"}}>{KIND_ICON[e.kind]||"•"} {e.title}<span style={{color:C.sage,fontWeight:600}}>{time}</span></span>
        </div>
      );
    });
    return {rows,hidden};
  };
  const nearView=render(near,true,nearAll?0:NEAR_LIMIT);
  // 标题里的数字：本页事项正常显示，另一边的数量用浅色附在后面
  const counts=list=>{
    const mine=list.filter(e=>e.mine).length,theirs=list.length-mine;
    return <>{mine}{theirs>0&&<span style={{fontWeight:400,color:C.mist,fontSize:12}}> · {otherLabel} {theirs}</span>}</>;
  };
  return(
    <div>
      <div onClick={toggleNear} style={{fontSize:13,fontWeight:700,color:C.fir,marginBottom:6,cursor:"pointer"}}>
        🗓 今天 / 明天 · {counts(near)} {nearOpen?"▲":"▼"}
      </div>
      {nearOpen&&(near.length?nearView.rows:<div style={{fontSize:12,color:C.mist}}>今明两天没有安排</div>)}
      {nearOpen&&(nearView.hidden>0||nearAll)&&(
        <div onClick={()=>setNearAll(v=>!v)} style={{fontSize:12,color:C.sage,cursor:"pointer",marginTop:2}}>
          {nearAll?"收起 ▲":`还有 ${nearView.hidden} 项 ▼`}
        </div>
      )}
      <div onClick={toggleWeek} style={{marginTop:12,fontSize:13,fontWeight:700,color:C.fir,cursor:"pointer"}}>
        🗓 未来 7 天 · {counts(later)} {weekOpen?"▲":"▼"}
      </div>
      {weekOpen&&<div style={{marginTop:4}}>{later.length?render(later,false,0).rows:<div style={{fontSize:12,color:C.mist}}>未来一周没有安排</div>}</div>}
    </div>
  );
}

// 当前登录的账号（从服务器取一次）；loading 时还不知道是否登录
function useMe(){
  const key=getKey();
  const [state,setState]=useState({me:null,loading:!!key});
  useEffect(()=>{
    if(!key){setState({me:null,loading:false});return;}
    accountCall("me").then(d=>setState({me:d.user,loading:false})).catch(()=>setState({me:null,loading:false}));
  },[key]);
  return state;
}

// Wall-clock time in `tz` → the viewer's local date/time (activities are stored in their original timezone).
function toLocal(date,time,tz){
  if(!date||!time||!tz) return {date,time};
  try{
    const [y,m,d]=date.split("-").map(Number),[hh,mm]=time.split(":").map(Number);
    const fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const offset=t=>{const p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-t;};
    const guess=Date.UTC(y,m-1,d,hh,mm);
    let inst=guess-offset(guess);
    inst=guess-offset(inst);
    const L=new Date(inst);
    return {date:`${L.getFullYear()}-${pad2(L.getMonth()+1)}-${pad2(L.getDate())}`,time:`${pad2(L.getHours())}:${pad2(L.getMinutes())}`};
  }catch{return {date,time};}
}
const localWhen=a=>{
  const L=toLocal(a.date,a.time,a.timezone);
  const E=a.endTime?toLocal(a.date,a.endTime,a.timezone):null;
  const converted=L.date!==a.date||L.time!==a.time;
  return {...L,endTime:E&&E.date===L.date?E.time:"",converted};
};

// 已报名的活动：前一天出现在提醒邮件里，并同步到订阅日历（不设闹钟）；想参加且有报名截止的，截止前一天和当天提醒。
function buildActivityEvents(acts,today){
  const ev=[];
  acts.forEach(a=>{
    const W=localWhen(a);
    if(a.status==="registered"&&W.date&&W.date>=addDays(today,-30)){
      const detail=[a.organizer,W.converted?`原时间 ${a.date.slice(5)} ${a.time} ${tzLabel(a.timezone)}`:"",a.joinUrl?"参会链接见标题":""].filter(Boolean).join(" · ");
      ev.push({id:`act-${a.id}`,kind:"activity",title:a.title,detail,date:W.date,time:W.time||"",endTime:W.endTime,url:a.joinUrl||a.regUrl||"",remindOn:[addDays(W.date,-1)],noAlarm:true});
    }
    if(a.status==="interested"&&a.regDeadline&&a.regDeadline>=addDays(today,-1)){
      ev.push({id:`act-${a.id}-reg`,kind:"deadline",title:`报名截止：${a.title}`,detail:a.organizer||"",date:a.regDeadline,time:"",url:a.regUrl||"",remindOn:[addDays(a.regDeadline,-1),a.regDeadline],noAlarm:true});
    }
  });
  return ev;
}

function ActivitiesTab({acts,context,applications,onEdit,onDel,onStatus}){
  const [pastOpen,setPastOpen]=useState(false);
  const today=todayStr();
  const withWhen=acts.map(a=>({a,W:localWhen(a)}));
  // 「即将进行」：日期未到，或者已报名但还没标记参加/错过
  const upcoming=withWhen.filter(({a,W})=>!W.date||W.date>=today||a.status==="registered").sort((x,y)=>(x.W.date+x.W.time).localeCompare(y.W.date+y.W.time));
  const past=withWhen.filter(x=>!upcoming.includes(x)).sort((x,y)=>(y.W.date+y.W.time).localeCompare(x.W.date+x.W.time));
  const grid=list=>(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
      {list.map(({a})=><ActivityCard key={a.id} act={a} context={context} applications={applications} onEdit={()=>onEdit(a)} onDel={()=>onDel(a.id)} onStatus={s=>onStatus(a.id,s)}/>)}
    </div>

  if(acts.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>

      <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无活动</div>

    </div>
  );
  return(
    <div>
      <div style={{fontSize:13,fontWeight:700,color:C.moss,marginBottom:10}}>即将进行 · {upcoming.length}</div>
      {upcoming.length?grid(upcoming):<div style={{fontSize:12,color:C.mist,marginBottom:10}}>没有即将进行的活动</div>}

      )}
    </div>
  );
}

const FOLLOWUP_FIRST_DAYS=5;  // 发出套磁信后几天提醒第一次跟进
const FOLLOWUP_AGAIN_DAYS=2;  // 跟进后仍没回复，几天后再提醒

function followupDue(p){
  if(p.status==="sent"&&p.sentDate) return {date:addDays(p.sentDate,FOLLOWUP_FIRST_DAYS),label:"第一次跟进",base:`${p.sentDate} 发出`};
  if(p.status==="followed"&&p.followedDate) return {date:addDays(p.followedDate,FOLLOWUP_AGAIN_DAYS),label:"再次跟进",base:`${p.followedDate} 跟进过`};
  return null;
}

function buildPhdEvents(professors,applications,today){
  const ev=[];
  professors.forEach(p=>{
    const f=followupDue(p);
    if(!f) return;
    ev.push({id:`prof-${p.id}-${p.status}`,kind:"followup",title:`${p.name}（${p.institution}）`,detail:`${f.label} · ${f.base}`,date:f.date,time:"",url:p.url||"",remindOn:[f.date],repeatUntilDone:true});
  });
  applications.forEach(a=>{
    if(a.status!=="prep"||a.rolling||!a.deadline||a.deadline<addDays(today,-30)) return;
    ev.push({id:`app-${a.id}`,kind:"deadline",title:`${a.school} · ${a.program} 网申截止`,detail:a.cycle||"",date:a.deadline,time:"",url:a.url||"",remindOn:[-7,-1,0].map(n=>addDays(a.deadline,n))});
  });
  return ev;
}

function FollowupHint({prof,onMarkFollowed}){
  const f=followupDue(prof);
  if(!f){
    return prof.status==="sent"&&!prof.sentDate
      ?<div style={{fontSize:11,color:"#b07030",margin:"4px 0 6px"}}>⚠️ 没填发送日期，不会提醒跟进</div>
      :null;
  }
  const today=todayStr();
  const due=today>=f.date;
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,margin:"4px 0 6px",background:due?"#FDECEC":C.cream,borderRadius:7,padding:"4px 8px"}}>
      <span style={{fontSize:11,color:due?"#c0392b":C.textLight,fontWeight:due?700:400}}>⏰ {f.label} {f.date.slice(5)}（{dueLabel(f.date,today)}）</span>
      {due&&<button onClick={onMarkFollowed} style={{padding:"2px 8px",borderRadius:6,border:"none",background:C.sage,color:C.white,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>✓ 已跟进</button>}
    </div>
  );
}

function migrateProfessor(p){
  const researchAreas=Array.isArray(p.researchAreas)
    ?p.researchAreas
    :(p.researchArea?String(p.researchArea).split(/[、,，;；\/]+/).map(s=>s.trim()).filter(Boolean):[]);
  return {
    name:          p.name          ?? "",
    institution:   p.institution   ?? "",
    researchAreas,
    status:        PROF_STATUS.some(s=>s.key===p.status)?p.status:"pending",
    sentDate:      p.sentDate      ?? "",
    followedDate:  p.followedDate  ?? "",
    url:           p.url           ?? "",
    note:          p.note          ?? "",
    applicationIds:Array.isArray(p.applicationIds)?p.applicationIds:[],
    contacts:      Array.isArray(p.contacts)?p.contacts:[],
    id:            p.id            ?? Date.now(),
  };
}

function migrateApplication(a){
  return {
    school:  a.school  ?? "",
    program: a.program ?? "",
    cycle:   a.cycle   ?? "",
    deadline:a.deadline?? "",
    rolling: !!a.rolling,
    status:  APP_STATUS.some(s=>s.key===a.status)?a.status:"prep",
    url:     a.url     ?? "",
    note:    a.note    ?? "",
    id:      a.id      ?? Date.now(),
  };
}

function TagMultiSelect({value=[],onChange,pool=[],onAddToPool}){
  const [input,setInput]=useState("");
  const [open,setOpen]=useState(false);
  const inputRef=useRef(null);
  const add=tag=>{
    const t=tag.trim();
    if(!t) return;
    if(!value.includes(t)) onChange([...value,t]);
    if(!pool.includes(t)) onAddToPool(t);
    setInput("");
  };
  const remove=tag=>onChange(value.filter(v=>v!==tag));
  const q=input.trim().toLowerCase();
  const filtered=pool.filter(t=>!value.includes(t)&&(!q||t.toLowerCase().includes(q)));
  const canCreate=q&&!pool.some(t=>t.toLowerCase()===q);
  return(
    <div style={{position:"relative"}}>
      <div onClick={()=>inputRef.current?.focus()} style={{...inp,display:"flex",flexWrap:"wrap",gap:6,minHeight:38,alignItems:"center",cursor:"text"}}>
        {value.map(tag=>(
          <span key={tag} style={{display:"inline-flex",alignItems:"center",gap:4,background:C.frost,color:C.moss,borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:600}}>
            {tag}
            <button type="button" onClick={e=>{e.stopPropagation();remove(tag);}} style={{background:"none",border:"none",cursor:"pointer",color:C.moss,fontSize:12,lineHeight:1,padding:0}}>×</button>
          </span>
        ))}
        <input ref={inputRef} value={input}
          onChange={e=>{setInput(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),120)}
          onKeyDown={e=>{
            if(e.key==="Enter"){e.preventDefault(); if(input.trim()) add(input);}
            else if(e.key==="Backspace"&&!input&&value.length>0) remove(value[value.length-1]);
          }}
          placeholder={value.length?"":"输入关键词，回车添加，可逐个累加…"}
          style={{flex:1,minWidth:100,border:"none",outline:"none",background:"transparent",fontSize:13,color:C.text,padding:"2px 0"}}/>
      </div>
      {open&&(filtered.length>0||canCreate)&&(
        <div onMouseDown={e=>e.preventDefault()} style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:C.white,border:`1px solid ${C.border}`,borderRadius:8,boxShadow:`0 4px 16px ${C.shadow}`,zIndex:20,maxHeight:180,overflowY:"auto",padding:4}}>
          {filtered.map(tag=>(
            <div key={tag} onClick={()=>add(tag)} style={{padding:"6px 10px",fontSize:13,color:C.text,cursor:"pointer",borderRadius:6}}
              onMouseOver={e=>e.currentTarget.style.background=C.cream} onMouseOut={e=>e.currentTarget.style.background="transparent"}>{tag}</div>
          ))}
          {canCreate&&(
            <div onClick={()=>add(input)} style={{padding:"6px 10px",fontSize:13,color:C.sage,cursor:"pointer",borderRadius:6,fontWeight:600}}
              onMouseOver={e=>e.currentTarget.style.background=C.cream} onMouseOut={e=>e.currentTarget.style.background="transparent"}>＋ 创建 "{input.trim()}"</div>
          )}
        </div>
      )}
    </div>
  );
}

function ProfessorForm({initial,applications,tagPool,onAddToPool,onSave,onCancel}){
  const [form,setForm]=useState(initial||EMPTY_PROF);
  const [rawText,setRawText]=useState("");
  const [parsing,setParsing]=useState(false);
  const [msg,setMsg]=useState("");
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  // Default the send / follow-up date to today the first time the status reaches that stage.
  const setStatus=v=>setForm(f=>({...f,status:v,
    sentDate:(v==="sent"||v==="followed")&&!f.sentDate?todayStr():f.sentDate,
    followedDate:v==="followed"&&!f.followedDate?todayStr():f.followedDate,
  }));
  const fu=followupDue(form);

  const parse=async()=>{
    if(!rawText.trim()) return;
    setParsing(true); setMsg("正在提取信息…");
    try{
      const res=await fetch("/api/extract-phd-professor",{
        method:"POST",
        headers:aiHeaders(),
        body:JSON.stringify({text:rawText})
      });
      const json=await res.json();
      if(!res.ok) throw new Error(json.error||"failed");
      const newAreas=Array.isArray(json.researchAreas)?json.researchAreas.map(s=>String(s).trim()).filter(Boolean):[];
      setForm(f=>({...f,
        name:       json.name       ||f.name,
        institution:json.institution||f.institution,
        researchAreas:[...new Set([...(f.researchAreas||[]),...newAreas])],
      }));
      newAreas.forEach(onAddToPool);
      setMsg(newAreas.length?"✅ 提取成功，请核对后保存":"✅ 提取成功，未识别到研究方向，请手动补充");
    }catch(e){ setMsg(aiFailMsg(e)); }
    setParsing(false);
  };

  return(
    <div>
      <h3 style={{margin:"0 0 16px",color:C.fir,fontSize:17}}>{initial?.id?"编辑套磁记录":"添加套磁记录"}</h3>
      {!initial?.id&&(
        <div style={{background:C.frost,borderRadius:10,padding:14,marginBottom:16}}>
          <label style={{...lbl,color:C.moss}}>🔍 自动提取导师信息</label>
          <textarea value={rawText} onChange={e=>setRawText(e.target.value)}
            placeholder="复制导师个人主页文字粘贴至此，自动识别姓名、院校、研究方向…"
            style={{...inp,height:72,resize:"vertical",fontSize:12,lineHeight:1.5,fontFamily:"inherit",marginTop:6,marginBottom:10}}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            {msg?<span style={{fontSize:12,color:msg.startsWith("✅")?C.sage:msg.startsWith("⚠️")?"#b07030":C.textLight}}>{msg}</span>:<span style={{fontSize:12,color:C.textLight}}>粘贴文字后点击自动填写</span>}
            <button onClick={parse} disabled={parsing||!rawText.trim()}
              style={{padding:"7px 16px",borderRadius:8,border:"none",background:parsing?C.mist:C.fir,color:C.white,cursor:parsing?"not-allowed":"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,marginLeft:10}}>
              {parsing?"提取中…":"自动填写"}
            </button>
          </div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div><label style={lbl}>导师姓名 *</label><input style={inp} value={form.name} onChange={e=>set("name",e.target.value)} placeholder="如：Prof. Smith"/></div>
        <div><label style={lbl}>所在院校 *</label><input style={inp} value={form.institution} onChange={e=>set("institution",e.target.value)} placeholder="如：MIT"/></div>
        <div style={{gridColumn:"1/-1"}}>
          <label style={lbl}>研究方向（可逐个添加多个关键词）</label>
          <TagMultiSelect value={form.researchAreas||[]} onChange={v=>set("researchAreas",v)} pool={tagPool} onAddToPool={onAddToPool}/>

        <div><label style={lbl}>套磁进度</label>

          </div>

        <div style={{gridColumn:"1/-1"}}><label style={lbl}>个人主页/Lab链接</label>
          <textarea rows={1} style={{...inp,resize:"vertical",minHeight:38,lineHeight:1.4,wordBreak:"break-all",fontFamily:"inherit"}} value={form.url||""} onChange={e=>set("url",e.target.value)} placeholder="https://..."/>

      </div>
      <div style={{marginTop:16}}>
        <label style={{...lbl,fontSize:13,color:C.moss}}>📝 沟通与反馈记录</label>

      <div style={{display:"flex",gap:10,marginTop:18,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"8px 20px",borderRadius:8,border:`1px solid ${C.border}`,background:C.cream,color:C.textLight,cursor:"pointer",fontSize:14}}>取消</button>
        <button onClick={()=>form.name&&form.institution&&onSave(form)}
          style={{padding:"8px 22px",borderRadius:8,border:"none",background:C.fir,color:C.white,cursor:"pointer",fontSize:14,fontWeight:600}}>保存</button>
      </div>
    </div>
  );

    if(!rawText.trim()) return;
    setParsing(true); setMsg("正在提取信息…");
    try{
      const res=await fetch("/api/extract-phd",{
        method:"POST",
        headers:aiHeaders(),

      }));

// 列表视图的研究方向：默认只显示前几个，点 +N 展开 / 收起
function ResearchTagsCell({tags,limit=3}){
  const [open,setOpen]=useState(false);
  if(!tags.length) return <span style={{color:C.mist,fontSize:12}}>—</span>;
  const shown=open?tags:tags.slice(0,limit);
  const hidden=tags.length-limit;
  const chip={borderRadius:6,padding:"1px 6px",fontSize:11,fontWeight:600,lineHeight:"18px",whiteSpace:"nowrap"};
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:3}} title={open?"":tags.join(" · ")}>
      {shown.map(tag=><span key={tag} style={{...chip,background:C.frost,color:C.moss}}>{tag}</span>)}
      {hidden>0&&(
        <button type="button" onClick={()=>setOpen(o=>!o)}
          style={{...chip,background:"transparent",color:C.moss,border:`1px dashed ${C.moss}`,cursor:"pointer"}}>
          {open?"收起":`+${hidden}`}
        </button>
      )}
    </div>
  );
}

// Bulk-edit bar for list view: only fields given a value are changed; blank means "leave as is".
function BatchBar({count,fields,onApply,onDelete,onClear}){
  const [vals,setVals]=useState({});
  const patch=Object.fromEntries(Object.entries(vals).filter(([,v])=>v!==""));
  const n=Object.keys(patch).length;
  const ctl={padding:"5px 8px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:12,background:C.white,color:C.text};
  const apply=()=>{
    if(!n) return;
    const desc=fields.filter(f=>f.key in patch).map(f=>`${f.label}→${f.type==="select"?f.options.find(o=>o.key===patch[f.key])?.label:patch[f.key]}`).join("，");
    if(!confirm(`将对 ${count} 条记录修改：${desc}，确认？`)) return;
    onApply(patch); setVals({});
  };
  return(
    <div style={{position:"sticky",top:8,zIndex:5,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:C.frost,border:`1.5px solid ${C.sage}`,borderRadius:12,padding:"10px 14px",marginBottom:12,boxShadow:`0 4px 14px ${C.shadow}`}}>
      <span style={{fontSize:13,fontWeight:700,color:C.fir}}>已选 {count} 条</span>
      {fields.map(f=>(
        <label key={f.key} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:C.textLight}}>
          {f.label}
          {f.type==="select"
            ?<select style={ctl} value={vals[f.key]||""} onChange={e=>setVals(v=>({...v,[f.key]:e.target.value}))}>
              <option value="">不修改</option>
              {f.options.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
            </select>
            :<input type={f.type} style={{...ctl,width:f.type==="date"?140:110}} value={vals[f.key]||""} placeholder="不修改" onChange={e=>setVals(v=>({...v,[f.key]:e.target.value}))}/>}
        </label>
      ))}
      <button onClick={apply} disabled={!n} style={{padding:"6px 14px",borderRadius:8,border:"none",background:n?C.fir:C.mist,color:C.white,fontSize:12,fontWeight:600,cursor:n?"pointer":"not-allowed"}}>应用</button>
      <span style={{flex:1}}/>
      <button onClick={onDelete} style={{padding:"5px 10px",borderRadius:7,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:12,cursor:"pointer"}}>删除所选</button>
      <button onClick={onClear} style={{background:"none",border:"none",color:C.textLight,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>取消选择</button>
    </div>
  );
}

    try{
      const saved=JSON.parse(localStorage.getItem(lsKey("phd_research_tags"))||"null");

    }catch{}
    // 首次运行：从已有套磁记录里回填标签池，兼容旧的自由文本研究方向字段
    try{
      const profs=JSON.parse(localStorage.getItem(lsKey("phd_professors"))||"[]");

      profs.forEach(p=>{
        const areas=Array.isArray(p.researchAreas)?p.researchAreas:(p.researchArea?String(p.researchArea).split(/[、,，;；\/]+/).map(s=>s.trim()).filter(Boolean):[]);

  const addResearchTag=tag=>setResearchTagPool(pool=>pool.includes(tag)?pool:[...pool,tag].sort((a,b)=>a.localeCompare(b,"zh")));

  const getInboxKey=()=>{
    const key=getKey();
    if(!key) setInboxError("还没登录：点右边「👤 账号」登录或注册");
    return key;
  };
  const extractForItem=async item=>{
    setInboxExtractions(prev=>({...prev,[item.id]:{loading:true}}));
    try{
      const isEvent=item.kind==="event";
      const res=await fetch(isEvent?"/api/extract-event":"/api/extract-phd",{
        method:"POST",
        headers:aiHeaders(),
        body:JSON.stringify({...(item.type==="url"?{url:item.content}:{text:item.content}),...(isEvent?{context:"phd"}:{})}),
      });
      const json=await res.json();
      setInboxExtractions(prev=>({...prev,[item.id]:{...json,loading:false}}));
    }catch{
      setInboxExtractions(prev=>({...prev,[item.id]:{loading:false,error:true}}));
    }
  };
  const fetchInbox=async()=>{
    const key=getInboxKey();
    if(!key) return;
    setInboxLoading(true); setInboxError("");
    try{
      const res=await fetch("/api/inbox-list?target=phd",{headers:{"X-Inbox-Key":key}});
      if(res.status===401){ setInboxError("⚠️ 登录已失效，点右边「👤 账号」重新登录"); setInboxLoading(false); return; }
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||"failed");
      const items=data.items||[];
      setInboxItems(items);
      items.forEach(item=>{ if(!inboxExtractions[item.id]) extractForItem(item); });

          headers:{"Content-Type":"application/json","X-Inbox-Key":key},
          body:JSON.stringify({id,target:"phd"}),

                              ?<span style={{color:C.textLight}}>🔄 滚动招生</span>
                              :app.deadline
                                ?<span style={{color:urgent?"#e05050":expired?"#aaa":C.textLight,fontWeight:urgent?700:400}}>{app.deadline}{urgent&&" ❗"}{expired&&" (已过期)"}</span>
                                :<span style={{color:C.mist}}>—</span>}
                          </td>
                          <td style={{...td,color:C.textLight,fontSize:12,maxWidth:150,wordBreak:"break-word"}}>{linkedProfs.length?linkedProfs.map(p=>p.name).join('，'):"—"}</td>
                          <td style={{...td,color:C.textLight,fontStyle:"italic",maxWidth:110,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={app.note||""}>{app.note||"—"}</td>
                          <td style={{...td,whiteSpace:"nowrap"}}>{rowBtns(()=>setAModal(app),()=>delApp(app.id))}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

      </div>

      <Modal open={!!pModal} onClose={()=>setPModal(null)}>
        <ProfessorForm initial={pModal==="add"?null:pModal} applications={applications} tagPool={researchTagPool} onAddToPool={addResearchTag} onSave={saveProf} onCancel={()=>setPModal(null)}/>
      </Modal>
      <Modal open={!!aModal} onClose={closeAModal}>
        <ApplicationForm initial={aModal==="add"?null:aModal} onSave={saveApp} onCancel={closeAModal}/>
      </Modal>
      <Modal open={!!actModal} onClose={closeActModal}>
        <ActivityForm key={actModal&&actModal.id?actModal.id:"new"} initial={actModal==="add"?null:actModal} context="phd" applications={applications} onSave={saveAct} onCancel={closeActModal}/>
      </Modal>
      <Modal open={reminderOpen} onClose={()=>setReminderOpen(false)}>
        <ReminderPanel events={reminderEvents} sync={reminderSync} resync={resyncReminders} onOpenAccount={()=>{setReminderOpen(false);setAccountOpen(true);}}/>
      </Modal>
      <Modal open={accountOpen} onClose={()=>setAccountOpen(false)}>
        <AccountPanel/>
      </Modal>
      <Modal open={inboxOpen} onClose={()=>setInboxOpen(false)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{color:C.fir,fontSize:17}}>📥 收件箱</h3>
          <button onClick={()=>setAccountOpen(true)} style={{background:"none",border:"none",color:C.textLight,fontSize:11,cursor:"pointer",textDecoration:"underline"}}>👤 账号</button>
        </div>
        {inboxLoading&&<div style={{fontSize:12,color:C.textLight,textAlign:"center",padding:"12px 0"}}>加载中…</div>}
        {!inboxLoading&&inboxError&&<div style={{fontSize:12,color:"#b05050",textAlign:"center",padding:"12px 0"}}>{inboxError}</div>}
        {!inboxLoading&&!inboxError&&inboxItems.length===0&&<div style={{fontSize:12,color:C.mist,textAlign:"center",padding:"12px 0"}}>收件箱是空的</div>}
        {!inboxLoading&&!inboxError&&inboxItems.map(item=>{
          const ext=inboxExtractions[item.id];
          return(
          <div key={item.id} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",marginBottom:8}}>
            <div style={{fontSize:12,color:C.text,wordBreak:"break-word",whiteSpace:"pre-wrap",marginBottom:6}}>
              {item.type==="url"
                ?<a href={item.content} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{item.content}</a>
                :item.content}
            </div>
            {ext&&ext.loading&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>🔍 识别中…</div>}
            {ext&&!ext.loading&&isAiGateMsg(ext.error)&&<div style={{fontSize:11,color:"#b05050",marginBottom:6}}>⚠️ {ext.error}</div>}
            {item.kind==="event"&&ext&&!ext.loading&&!ext.error&&<div style={{fontSize:11,color:ext.title?C.sage:C.mist,fontWeight:ext.title?600:400,marginBottom:6}}>
              {ext.title?`📅 推测：${ext.title}${ext.date?` · ${ext.date}`:""}${ext.time?` ${ext.time} ${tzLabel(ext.timezone)}`:""}`:"未识别出活动信息"}
            </div>}
            {item.kind!=="event"&&ext&&!ext.loading&&!ext.error&&ext.school&&<div style={{fontSize:11,color:C.sage,fontWeight:600,marginBottom:6}}>推测：{ext.school}{ext.program?` · ${ext.program}`:""}</div>}
            {item.kind!=="event"&&ext&&!ext.loading&&!ext.error&&!ext.school&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>未识别出学校/项目信息</div>}
            <div style={{fontSize:10,color:C.mist,marginBottom:6}}>{new Date(item.createdAt).toLocaleString()}</div>
            <div style={{display:"flex",gap:6}}>
              {item.kind==="event"?(
                <button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{flex:1,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成活动"}
                </button>
              ):<>
                <button onClick={()=>convertInboxItem(item)} disabled={convertingId===item.id}
                  style={{flex:1,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成网申项目"}
                </button>
                <button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${C.sage}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>转成活动</button>
              </>}
              <button onClick={()=>ignoreInboxItem(item)} style={{padding:"5px 10px",borderRadius:6,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:11,cursor:"pointer"}}>忽略</button>
            </div>
          </div>
          );
        })}
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
