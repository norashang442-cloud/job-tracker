<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>在路上 · 申博</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang SC','Inter',sans-serif;background:#F1F4F9;color:#1C2433;}
button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #5A7BA6;outline-offset:1px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#F1F4F9;}
::-webkit-scrollbar-thumb{background:#A9BCD6;border-radius:3px;}
.card:hover{box-shadow:0 4px 16px rgba(43,58,85,0.2)!important;}

/* Button press effect */
button{transition:transform 0.1s,box-shadow 0.1s,background 0.15s!important;}
button:hover:not(:disabled){transform:scale(0.97);}
button:active:not(:disabled){transform:scale(0.95);}

/* Modal animations */
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-backdrop{animation:backdropIn 0.2s ease}
.modal-box{animation:modalIn 0.22s cubic-bezier(0.34,1.56,0.64,1)}

/* Tab fade */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab-content{animation:fadeIn 0.18s ease}

/* Collapsible slide */
.collapsible{overflow:hidden;transition:max-height 0.22s cubic-bezier(0.4,0,0.2,1),opacity 0.18s ease;}
.collapsible.open{max-height:600px;opacity:1;}
.collapsible.closed{max-height:0;opacity:0;}

/* Header / agenda layout, incl. narrow screens */
.hdr{padding:12px 24px;}
.tabscroll{overflow-x:auto;scrollbar-width:none;max-width:100%;}
.tabscroll::-webkit-scrollbar{display:none;}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:640px){
  .hdr{padding:10px 12px;}
  .mtab{padding:6px 12px!important;font-size:13px!important;}
  .hdr-actions button,.hdr-actions label{padding:7px 12px!important;font-size:13px!important;}
  .agenda-grid{grid-template-columns:1fr;gap:12px;}
}

/* Top panel: dark nav row + light info row, three aligned columns */
.top-grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;}
.top-cell{padding:14px 20px;min-width:0;}
.top-div-dark{border-left:1px solid rgba(255,255,255,0.16);}
@media (max-width:900px){
  .top-grid{grid-template-columns:1fr;}
  .top-div-dark,.top-div-light{border-left:none!important;}
  .top-cell{padding:10px 14px;}
}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
// 申博页用墨蓝色调，和秋招页的森林绿区分开；状态标签颜色两边保持一致
const C={
  fir:"#2B3A55",moss:"#34496B",sage:"#5A7BA6",reed:"#7E9CC4",
  mist:"#A9BCD6",frost:"#DCE5F2",cream:"#F1F4F9",white:"#FFFFFF",
  text:"#1C2433",textLight:"#4A5A73",border:"#C3D0E3",shadow:"rgba(43,58,85,0.12)"
};
const PROF_STATUS=[
  {key:"pending", label:"待发送", color:"#6B6B6B",bg:"#ECECEC"},
  {key:"sent",    label:"已发送", color:"#5C7A60",bg:"#E8F2E8"},
  {key:"followed",label:"已跟进", color:"#5E5A7A",bg:"#E8E6F2"},
  {key:"replied", label:"已回复", color:"#7A6E2F",bg:"#F5F2DC"},
  {key:"talked",  label:"已约谈", color:"#2F5A7A",bg:"#DCF0F5"},
  {key:"success", label:"成功",   color:"#2F6640",bg:"#D4EDD8"},
  {key:"failed",  label:"未成功", color:"#7A3030",bg:"#F5DCDC"},
];
const APP_STATUS=[
  {key:"prep",      label:"材料准备中",  color:"#6B6B6B",bg:"#ECECEC"},
  {key:"submitted", label:"已提交",     color:"#5C7A60",bg:"#E8F2E8"},
  {key:"review",    label:"审核/面试中", color:"#2F5A7A",bg:"#DCF0F5"},
  {key:"admitted",  label:"已录取",     color:"#2F6640",bg:"#D4EDD8"},
  {key:"waitlist",  label:"Waitlist",  color:"#7A6E2F",bg:"#F5F2DC"},
  {key:"rejected",  label:"未录取",     color:"#7A3030",bg:"#F5DCDC"},
];
const EMPTY_PROF={name:"",institution:"",researchAreas:[],status:"pending",sentDate:"",followedDate:"",url:"",note:"",applicationIds:[],contacts:[]};
const EMPTY_APP={school:"",program:"",cycle:"",deadline:"",rolling:false,status:"prep",url:"",note:""};

const inp={width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:14,color:C.text,background:C.cream};
const lbl={fontSize:12,color:C.textLight,marginBottom:4,display:"block",fontWeight:600};

const URL_RE=/(https?:\/\/[^\s<>"'）】」』，。！？；：]+)/g;
function linkifyText(text){
  if(!text) return text;
  return String(text).split(URL_RE).map((part,i)=>
    /^https?:\/\//.test(part)
      ?<a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:C.fir,wordBreak:"break-all"}} onClick={e=>e.stopPropagation()}>{part}</a>
      :part
  );
}

// ---------- 提醒（每日邮件 + 日历订阅），与 index.html 保持一致 ----------
const pad2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const diffDays=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
const isDue=(e,today)=>e.remindOn.includes(today)||(e.repeatUntilDone&&today>=e.date);
const dueLabel=(date,today)=>{const d=diffDays(today,date);return d===0?"今天":d===1?"明天":d>1?`还有 ${d} 天`:`已逾期 ${-d} 天`;};
const getKey=()=>{try{return localStorage.getItem("jt4_inbox_key")||""}catch{return ""}};

// Push this page's reminders to the cloud (debounced) so the daily email / calendar feed can see them.
function useReminderSync(target,events){
  const [sync,setSync]=useState({state:"idle"});
  const json=JSON.stringify(events);
  const run=async()=>{
    const key=getKey();
    if(!key){setSync({state:"nokey"});return;}
    setSync(s=>({...s,state:"syncing"}));
    try{
      const res=await fetch("/api/reminders-sync",{method:"POST",headers:{"Content-Type":"application/json","X-Inbox-Key":key},body:JSON.stringify({target,events:JSON.parse(json)})});
      if(res.status===401){setSync({state:"badkey"});return;}
      const data=await res.json();
      if(!res.ok) throw new Error(data.error);
      setSync({state:"ok",count:data.count});
    }catch{setSync({state:"error"});}
  };
  useEffect(()=>{const t=setTimeout(run,1500);return()=>clearTimeout(t);},[json]);
  // 本地缓存一份，给另一个页面的日程卡片读
  useEffect(()=>{try{localStorage.setItem("agenda_"+target,json)}catch{}},[json]);
  return [sync,run];
}

const KIND_ICON={milestone:"📝",activity:"🎤",todo:"📌",deadline:"⏰",followup:"📮"};
const weekday=d=>"日一二三四五六"[new Date(d+"T00:00:00").getDay()];

const SERIF="'Noto Serif SC','Source Han Serif SC','Songti SC','STZhongsong','STSong','SimSun',Georgia,serif";

// 「在路上」：名字 + 一条延伸向远处的路，颜色跟随页面主题
function Brand(){
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,marginRight:4}}>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="12" stroke={C.mist} strokeWidth="1.2"/>
        <path d="M7 21 C 9 15, 15 15, 12.5 9.5 S 15 5.5, 16.5 5" stroke={C.frost} strokeWidth="1.6" strokeLinecap="round"/>
        <path d="M11 21 C 13 16.5, 18 15.5, 15.5 10 S 17 6.5, 17.5 5.5" stroke={C.reed} strokeWidth="1.1" strokeLinecap="round"/>
      </svg>
      <span style={{fontFamily:SERIF,color:C.frost,fontSize:19,fontWeight:700,letterSpacing:2,whiteSpace:"nowrap"}}>在路上</span>
    </div>
  );
}

// 让问候语、日期、日程跟着时间走：页面一直开着时每 5 分钟重新渲染一次
function useClock(ms=300000){
  const [,setTick]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setTick(t=>t+1),ms);return()=>clearInterval(id);},[]);
}

// 顶部左栏：问候 + 日期，一句克制的当日概况，题记
function Greeting({events,epigraph,epigraphBy,epigraphItalic}){
  useClock();
  const now=new Date();
  const h=now.getHours();
  const greet=h<5?"夜深了":h<11?"早上好":h<13?"中午好":h<18?"下午好":"晚上好";
  const today=todayStr();
  const todayItems=events.filter(e=>e.date===today||(e.repeatUntilDone&&e.date<today));
  const n=k=>todayItems.filter(e=>e.kind===k).length;
  const parts=[];
  if(n("milestone")) parts.push(`${n("milestone")} 场笔试 / 面试`);
  if(n("activity")) parts.push(`${n("activity")} 个活动`);
  const rest=todayItems.length-n("milestone")-n("activity");
  if(rest) parts.push(`${rest} 件事待处理`);
  return(
    <div>
      <div style={{fontFamily:SERIF,fontSize:24,fontWeight:700,color:C.fir,letterSpacing:1}}>
        {greet}，{now.getMonth()+1} 月 {now.getDate()} 日 · 周{weekday(today)}
      </div>
      <div style={{fontSize:13,color:C.textLight,marginTop:5}}>{parts.length?`今天 ${parts.join("，")}`:"今天没有到期的事项"}</div>
      <div style={{fontFamily:SERIF,fontSize:13,color:C.mist,marginTop:12,lineHeight:1.7,fontStyle:epigraphItalic?"italic":"normal"}}>
        {epigraph.map((line,i)=><div key={i}>{line}</div>)}
        <div style={{fontStyle:"normal",fontSize:12,marginTop:2}}>—— {epigraphBy}</div>
      </div>
    </div>
  );
}

// 顶部中栏：竖排的统计数字
function StatList({stats}){

// 秋招 / 申博切换：放在顶部栏最左边，表示「换一个工作区」，和本页的标签页分开
function PageSwitch({current}){
  const item=(key,href,label)=>key===current
    ?<span style={{padding:"7px 16px",borderRadius:20,background:C.white,color:C.fir,fontSize:14,fontWeight:700,whiteSpace:"nowrap"}}>{label}</span>

// 顶部右栏的日程：本页事项正常显示、点击打开对应记录；另一边的事项读它最近一次保存的本地缓存，
// 只淡淡显示「这段时间被占了」，不展开细节、不可点。「未来 7 天」默认折叠。
function AgendaPanel({events,target,onOpen}){
  useClock();
  const other=target==="job"?"phd":"job";
  const otherLabel=other==="job"?"秋招":"申博";
  const [weekOpen,setWeekOpen]=useState(()=>{try{return localStorage.getItem("agenda_week_open")==="1"}catch{return false}});
  const toggleWeek=()=>setWeekOpen(v=>{try{localStorage.setItem("agenda_week_open",v?"0":"1")}catch{} return !v;});
  const today=todayStr(),tomorrow=addDays(today,1),week=addDays(today,7);
  let otherEvents=[];
  try{otherEvents=JSON.parse(localStorage.getItem("agenda_"+other)||"[]")}catch{}
  const all=[...events.map(e=>({...e,mine:true})),...otherEvents.map(e=>({...e,mine:false}))]
    .sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  // 另一边逾期的待办不占用具体时间段，只显示本页自己的
  const near=all.filter(e=>e.date===today||e.date===tomorrow||(e.mine&&e.repeatUntilDone&&e.date<today));
  const later=all.filter(e=>e.date>tomorrow&&e.date<=week);
  const row=(e,nearCol)=>{
    const when=nearCol?(e.date<today?`逾期${diffDays(e.date,today)}天`:e.date===today?"今天":"明天"):`${e.date.slice(5)} 周${weekday(e.date)}`;
    const time=e.time?` ${e.time}${e.endTime?`–${e.endTime}`:""}`:"";
    if(!e.mine) return(
      <div key={"o-"+e.id} style={{display:"flex",gap:8,fontSize:11,color:C.mist,padding:"2px 0"}}>
        <span style={{width:62,flexShrink:0}}>{when}</span>
        <span style={{wordBreak:"break-word"}}><span style={{border:`1px solid ${C.border}`,borderRadius:4,padding:"0 4px",marginRight:5}}>{otherLabel}</span>{e.title}{time}</span>
      </div>
    );
    return(
      <div key={e.id} onClick={()=>onOpen(e)} title={e.detail||"点击打开"} style={{display:"flex",gap:8,fontSize:13,padding:"4px 6px",margin:"0 -6px",borderRadius:7,cursor:"pointer"}}
        onMouseOver={ev=>ev.currentTarget.style.background=C.cream} onMouseOut={ev=>ev.currentTarget.style.background="transparent"}>
        <span style={{width:62,flexShrink:0,fontSize:12,fontWeight:700,color:e.date<=today?"#c0392b":C.textLight}}>{when}</span>
        <span style={{color:C.text,wordBreak:"break-word"}}>{KIND_ICON[e.kind]||"•"} {e.title}<span style={{color:C.sage,fontWeight:600}}>{time}</span></span>
      </div>
    );
  };
  return(
    <div>
      <div style={{fontSize:13,fontWeight:700,color:C.fir,marginBottom:6}}>🗓 今天 / 明天</div>
      {near.length?near.map(e=>row(e,true)):<div style={{fontSize:12,color:C.mist}}>今明两天没有安排</div>}
      <div onClick={toggleWeek} style={{marginTop:10,fontSize:12,fontWeight:700,color:C.moss,cursor:"pointer"}}>
        未来 7 天 · {later.filter(e=>e.mine).length} {weekOpen?"▲":"▼"}
      </div>
      {weekOpen&&<div style={{marginTop:4}}>{later.length?later.map(e=>row(e,false)):<div style={{fontSize:12,color:C.mist}}>未来一周没有安排</div>}</div>}
    </div>
  );
}

function ReminderPanel({sync,resync}){
  const [msg,setMsg]=useState("");
  const [copied,setCopied]=useState(false);
  const key=getKey();
  const calUrl=`webcal://${location.host}/api/calendar?key=${encodeURIComponent(key)}`;
  const setKey=()=>{const k=prompt("请输入收件箱密钥（部署时在 Vercel 环境变量 INBOX_SECRET 里设置的值）");if(k){localStorage.setItem("jt4_inbox_key",k);resync();}};
  const sendTest=async()=>{
    setMsg("发送中…");
    try{
      await resync();
      const res=await fetch("/api/remind?test=1",{headers:{"X-Inbox-Key":key}});
      const d=await res.json();
      setMsg(res.ok?`✅ 已发送（含 ${d.due} 件到期事项），去邮箱看看`:`⚠️ ${d.error||"发送失败"}`);
    }catch{setMsg("⚠️ 发送失败，检查网络");}
  };
  const copy=()=>navigator.clipboard?.writeText(calUrl).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1500);});
  const syncText={idle:"",syncing:"同步中…",ok:`✅ 已同步到云端（本页 ${sync.count} 条提醒）`,nokey:"⚠️ 还没设置密钥，提醒不会同步到云端",badkey:"⚠️ 密钥错误，请重设",error:"⚠️ 同步失败，检查网络"}[sync.state];
  const smallBtn={padding:"5px 12px",borderRadius:7,border:`1px solid ${C.border}`,background:C.white,color:C.sage,fontSize:12,cursor:"pointer",textDecoration:"none",whiteSpace:"nowrap"};
  const section={fontSize:13,fontWeight:700,color:C.moss,margin:"18px 0 8px"};
  return(
    <div>
      <h3 style={{color:C.fir,fontSize:17,marginBottom:10}}>⚙️ 提醒设置</h3>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",fontSize:12,color:sync.state==="ok"?C.sage:C.textLight}}>
        <span style={{flex:1}}>{syncText}</span>
        <button onClick={setKey} style={smallBtn}>{key?"重设密钥":"设置密钥"}</button>
        {key&&<button onClick={resync} style={smallBtn}>立即同步</button>}
      </div>


      {key&&<>
        <div style={section}>📧 每日邮件</div>
        <div style={{fontSize:12,color:C.textLight,lineHeight:1.6,marginBottom:8}}>每天早上 8 点（北京时间）检查一次，有到期事项才发信。套磁跟进会每天重复提醒，直到你改了状态。</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <a href={`/api/remind?dry=1&key=${encodeURIComponent(key)}`} target="_blank" rel="noopener noreferrer" style={smallBtn}>预览今天的邮件</a>
          <button onClick={sendTest} style={{...smallBtn,background:C.sage,color:C.white,border:"none"}}>发一封测试邮件</button>
          {msg&&<span style={{fontSize:12,color:msg.startsWith("✅")?C.sage:"#b05050"}}>{msg}</span>}
        </div>

        <div style={section}>📅 日历订阅（秋招 + 申博）</div>
        <div style={{fontSize:12,color:C.textLight,lineHeight:1.6,marginBottom:8}}>最方便的方法：在 iPhone 上打开任意一封提醒邮件，点底部的「订阅提醒日历」。也可以复制下面的地址，在 iPhone「日历」设置里选「添加已订阅的日历」。订阅时记得<b>关闭「移除提醒」</b>，否则日历不会响。</div>
        <div style={{display:"flex",gap:8}}>
          <input readOnly value={calUrl} onFocus={e=>e.target.select()} style={{...inp,fontSize:11,flex:1}}/>
          <button onClick={copy} style={smallBtn}>{copied?"已复制":"复制"}</button>
        </div>
      </>}
    </div>
  );
}

// ---------- 活动（宣讲会 / 网络研讨会 / Open Day…），与 index.html / phd.html 保持一致 ----------
const EVENT_STATUS=[
  {key:"interested",label:"想参加",color:"#6B6B6B",bg:"#ECECEC"},
  {key:"registered",label:"已报名",color:"#2F5A7A",bg:"#DCF0F5"},
  {key:"attended",  label:"已参加",color:"#2F6640",bg:"#D4EDD8"},
  {key:"missed",    label:"错过了",color:"#7A3030",bg:"#F5DCDC"},
];
const EVENT_TZS=[["Asia/Shanghai","北京时间"],["Europe/London","英国时间"],["Europe/Paris","欧洲中部时间"],["America/New_York","美东时间"],["America/Los_Angeles","美西时间"],["Asia/Tokyo","日本时间"],["Australia/Sydney","悉尼时间"],["UTC","UTC"]];
const tzLabel=tz=>(EVENT_TZS.find(t=>t[0]===tz)||[tz,tz])[1];
const EVENT_TYPES={
  job:["宣讲会","Insight Day / 开放日","网络研讨会","Networking","求职技能讲座","其他"],
  phd:["项目宣讲 / Open Day","招生答疑","学术讲座 / Seminar","导师 / 实验室介绍","其他"],
};
const EMPTY_EVENT={title:"",organizer:"",type:"",date:"",time:"",endTime:"",timezone:"Asia/Shanghai",joinUrl:"",regUrl:"",regDeadline:"",status:"interested",note:"",takeaway:"",company:"",school:"",applicationId:null};
const migrateEvent=a=>({...EMPTY_EVENT,...a,status:EVENT_STATUS.some(s=>s.key===a.status)?a.status:"interested",id:a.id??Date.now()});

// Wall-clock time in `tz` → the viewer's local date/time (activities are stored in their original timezone).
function toLocal(date,time,tz){
  if(!date||!time||!tz) return {date,time};
  try{
    const [y,m,d]=date.split("-").map(Number),[hh,mm]=time.split(":").map(Number);
    const fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const offset=t=>{const p=Object.fromEntries(fmt.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-t;};
    const guess=Date.UTC(y,m-1,d,hh,mm);
    let inst=guess-offset(guess);
    inst=guess-offset(inst);
    const L=new Date(inst);
    return {date:`${L.getFullYear()}-${pad2(L.getMonth()+1)}-${pad2(L.getDate())}`,time:`${pad2(L.getHours())}:${pad2(L.getMinutes())}`};
  }catch{return {date,time};}
}
const localWhen=a=>{
  const L=toLocal(a.date,a.time,a.timezone);
  const E=a.endTime?toLocal(a.date,a.endTime,a.timezone):null;
  const converted=L.date!==a.date||L.time!==a.time;
  return {...L,endTime:E&&E.date===L.date?E.time:"",converted};
};

// 已报名的活动：前一天出现在提醒邮件里，并同步到订阅日历（不设闹钟）；想参加且有报名截止的，截止前一天和当天提醒。
function buildActivityEvents(acts,today){
  const ev=[];
  acts.forEach(a=>{
    const W=localWhen(a);
    if(a.status==="registered"&&W.date&&W.date>=addDays(today,-30)){
      const detail=[a.organizer,W.converted?`原时间 ${a.date.slice(5)} ${a.time} ${tzLabel(a.timezone)}`:"",a.joinUrl?"参会链接见标题":""].filter(Boolean).join(" · ");
      ev.push({id:`act-${a.id}`,kind:"activity",title:a.title,detail,date:W.date,time:W.time||"",endTime:W.endTime,url:a.joinUrl||a.regUrl||"",remindOn:[addDays(W.date,-1)],noAlarm:true});
    }
    if(a.status==="interested"&&a.regDeadline&&a.regDeadline>=addDays(today,-1)){
      ev.push({id:`act-${a.id}-reg`,kind:"deadline",title:`报名截止：${a.title}`,detail:a.organizer||"",date:a.regDeadline,time:"",url:a.regUrl||"",remindOn:[addDays(a.regDeadline,-1),a.regDeadline],noAlarm:true});
    }
  });
  return ev;
}

function ActivitiesTab({acts,context,applications,onEdit,onDel,onStatus}){
  const [pastOpen,setPastOpen]=useState(false);
  const today=todayStr();
  const withWhen=acts.map(a=>({a,W:localWhen(a)}));
  // 「即将进行」：日期未到，或者已报名但还没标记参加/错过
  const upcoming=withWhen.filter(({a,W})=>!W.date||W.date>=today||a.status==="registered").sort((x,y)=>(x.W.date+x.W.time).localeCompare(y.W.date+y.W.time));
  const past=withWhen.filter(x=>!upcoming.includes(x)).sort((x,y)=>(y.W.date+y.W.time).localeCompare(x.W.date+x.W.time));
  const grid=list=>(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
      {list.map(({a})=><ActivityCard key={a.id} act={a} context={context} applications={applications} onEdit={()=>onEdit(a)} onDel={()=>onDel(a.id)} onStatus={s=>onStatus(a.id,s)}/>)}
    </div>
  );
  if(acts.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>
      <div style={{fontSize:36,marginBottom:12}}>📅</div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无活动</div>
      <div style={{fontSize:13}}>点击「添加活动」，粘贴宣传链接或报名成功邮件即可自动识别；手机上可以用速记页的「📅 活动」先存进收件箱</div>
    </div>
  );
  return(
    <div>
      <div style={{fontSize:13,fontWeight:700,color:C.moss,marginBottom:10}}>即将进行 · {upcoming.length}</div>
      {upcoming.length?grid(upcoming):<div style={{fontSize:12,color:C.mist,marginBottom:10}}>没有即将进行的活动</div>}
      {past.length>0&&(
        <div style={{marginTop:22}}>
          <div onClick={()=>setPastOpen(v=>!v)} style={{fontSize:13,fontWeight:700,color:C.textLight,marginBottom:10,cursor:"pointer"}}>已结束 · {past.length} {pastOpen?"▲":"▼"}</div>
          {pastOpen&&grid(past)}
        </div>
      )}
    </div>
  );
}

const FOLLOWUP_FIRST_DAYS=5;  // 发出套磁信后几天提醒第一次跟进
const FOLLOWUP_AGAIN_DAYS=2;  // 跟进后仍没回复，几天后再提醒

function followupDue(p){
  if(p.status==="sent"&&p.sentDate) return {date:addDays(p.sentDate,FOLLOWUP_FIRST_DAYS),label:"第一次跟进",base:`${p.sentDate} 发出`};
  if(p.status==="followed"&&p.followedDate) return {date:addDays(p.followedDate,FOLLOWUP_AGAIN_DAYS),label:"再次跟进",base:`${p.followedDate} 跟进过`};
  return null;
}

function buildPhdEvents(professors,applications,today){
  const ev=[];
  professors.forEach(p=>{
    const f=followupDue(p);
    if(!f) return;
    ev.push({id:`prof-${p.id}-${p.status}`,kind:"followup",title:`${p.name}（${p.institution}）`,detail:`${f.label} · ${f.base}`,date:f.date,time:"",url:p.url||"",remindOn:[f.date],repeatUntilDone:true});
  });
  applications.forEach(a=>{
    if(a.status!=="prep"||a.rolling||!a.deadline||a.deadline<addDays(today,-30)) return;
    ev.push({id:`app-${a.id}`,kind:"deadline",title:`${a.school} · ${a.program} 网申截止`,detail:a.cycle||"",date:a.deadline,time:"",url:a.url||"",remindOn:[-7,-1,0].map(n=>addDays(a.deadline,n))});
  });
  return ev;
}

function FollowupHint({prof,onMarkFollowed}){
  const f=followupDue(prof);
  if(!f){
    return prof.status==="sent"&&!prof.sentDate
      ?<div style={{fontSize:11,color:"#b07030",margin:"4px 0 6px"}}>⚠️ 没填发送日期，不会提醒跟进</div>
      :null;
  }
  const today=todayStr();
  const due=today>=f.date;
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,margin:"4px 0 6px",background:due?"#FDECEC":C.cream,borderRadius:7,padding:"4px 8px"}}>
      <span style={{fontSize:11,color:due?"#c0392b":C.textLight,fontWeight:due?700:400}}>⏰ {f.label} {f.date.slice(5)}（{dueLabel(f.date,today)}）</span>
      {due&&<button onClick={onMarkFollowed} style={{padding:"2px 8px",borderRadius:6,border:"none",background:C.sage,color:C.white,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>✓ 已跟进</button>}
    </div>
  );
}

function migrateProfessor(p){
  const researchAreas=Array.isArray(p.researchAreas)
    ?p.researchAreas
    :(p.researchArea?String(p.researchArea).split(/[、,，;；\/]+/).map(s=>s.trim()).filter(Boolean):[]);
  return {
    name:          p.name          ?? "",
    institution:   p.institution   ?? "",
    researchAreas,
    status:        PROF_STATUS.some(s=>s.key===p.status)?p.status:"pending",
    sentDate:      p.sentDate      ?? "",
    followedDate:  p.followedDate  ?? "",
    url:           p.url           ?? "",
    note:          p.note          ?? "",
    applicationIds:Array.isArray(p.applicationIds)?p.applicationIds:[],
    contacts:      Array.isArray(p.contacts)?p.contacts:[],
    id:            p.id            ?? Date.now(),
  };
}

function TagMultiSelect({value=[],onChange,pool=[],onAddToPool}){
  const [input,setInput]=useState("");
  const [open,setOpen]=useState(false);
  const inputRef=useRef(null);
  const add=tag=>{
    const t=tag.trim();
    if(!t) return;
    if(!value.includes(t)) onChange([...value,t]);
    if(!pool.includes(t)) onAddToPool(t);
    setInput("");
  };
  const remove=tag=>onChange(value.filter(v=>v!==tag));
  const q=input.trim().toLowerCase();
  const filtered=pool.filter(t=>!value.includes(t)&&(!q||t.toLowerCase().includes(q)));
  const canCreate=q&&!pool.some(t=>t.toLowerCase()===q);
  return(
    <div style={{position:"relative"}}>
      <div onClick={()=>inputRef.current?.focus()} style={{...inp,display:"flex",flexWrap:"wrap",gap:6,minHeight:38,alignItems:"center",cursor:"text"}}>
        {value.map(tag=>(
          <span key={tag} style={{display:"inline-flex",alignItems:"center",gap:4,background:C.frost,color:C.moss,borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:600}}>
            {tag}
            <button type="button" onClick={e=>{e.stopPropagation();remove(tag);}} style={{background:"none",border:"none",cursor:"pointer",color:C.moss,fontSize:12,lineHeight:1,padding:0}}>×</button>
          </span>
        ))}
        <input ref={inputRef} value={input}
          onChange={e=>{setInput(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),120)}
          onKeyDown={e=>{
            if(e.key==="Enter"){e.preventDefault(); if(input.trim()) add(input);}
            else if(e.key==="Backspace"&&!input&&value.length>0) remove(value[value.length-1]);
          }}
          placeholder={value.length?"":"输入关键词，回车添加，可逐个累加…"}
          style={{flex:1,minWidth:100,border:"none",outline:"none",background:"transparent",fontSize:13,color:C.text,padding:"2px 0"}}/>
      </div>
      {open&&(filtered.length>0||canCreate)&&(
        <div onMouseDown={e=>e.preventDefault()} style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:C.white,border:`1px solid ${C.border}`,borderRadius:8,boxShadow:`0 4px 16px ${C.shadow}`,zIndex:20,maxHeight:180,overflowY:"auto",padding:4}}>
          {filtered.map(tag=>(
            <div key={tag} onClick={()=>add(tag)} style={{padding:"6px 10px",fontSize:13,color:C.text,cursor:"pointer",borderRadius:6}}
              onMouseOver={e=>e.currentTarget.style.background=C.cream} onMouseOut={e=>e.currentTarget.style.background="transparent"}>{tag}</div>
          ))}
          {canCreate&&(
            <div onClick={()=>add(input)} style={{padding:"6px 10px",fontSize:13,color:C.sage,cursor:"pointer",borderRadius:6,fontWeight:600}}
              onMouseOver={e=>e.currentTarget.style.background=C.cream} onMouseOut={e=>e.currentTarget.style.background="transparent"}>＋ 创建 "{input.trim()}"</div>
          )}
        </div>
      )}
    </div>
  );
}

  const shown=open?tags:tags.slice(0,limit);
  const hidden=tags.length-limit;
  const chip={borderRadius:6,padding:"1px 6px",fontSize:11,fontWeight:600,lineHeight:"18px",whiteSpace:"nowrap"};
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:3}} title={open?"":tags.join(" · ")}>
      {shown.map(tag=><span key={tag} style={{...chip,background:C.frost,color:C.moss}}>{tag}</span>)}
      {hidden>0&&(
        <button type="button" onClick={()=>setOpen(o=>!o)}
          style={{...chip,background:"transparent",color:C.moss,border:`1px dashed ${C.moss}`,cursor:"pointer"}}>
          {open?"收起":`+${hidden}`}
        </button>
      )}
    </div>
  );
}

// Bulk-edit bar for list view: only fields given a value are changed; blank means "leave as is".
function BatchBar({count,fields,onApply,onDelete,onClear}){
  const [vals,setVals]=useState({});
  const patch=Object.fromEntries(Object.entries(vals).filter(([,v])=>v!==""));
  const n=Object.keys(patch).length;
  const ctl={padding:"5px 8px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:12,background:C.white,color:C.text};
  const apply=()=>{
    if(!n) return;
    const desc=fields.filter(f=>f.key in patch).map(f=>`${f.label}→${f.type==="select"?f.options.find(o=>o.key===patch[f.key])?.label:patch[f.key]}`).join("，");
    if(!confirm(`将对 ${count} 条记录修改：${desc}，确认？`)) return;
    onApply(patch); setVals({});
  };
  return(
    <div style={{position:"sticky",top:8,zIndex:5,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:C.frost,border:`1.5px solid ${C.sage}`,borderRadius:12,padding:"10px 14px",marginBottom:12,boxShadow:`0 4px 14px ${C.shadow}`}}>
      <span style={{fontSize:13,fontWeight:700,color:C.fir}}>已选 {count} 条</span>
      {fields.map(f=>(
        <label key={f.key} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:C.textLight}}>
          {f.label}
          {f.type==="select"
            ?<select style={ctl} value={vals[f.key]||""} onChange={e=>setVals(v=>({...v,[f.key]:e.target.value}))}>
              <option value="">不修改</option>
              {f.options.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
            </select>
            :<input type={f.type} style={{...ctl,width:f.type==="date"?140:110}} value={vals[f.key]||""} placeholder="不修改" onChange={e=>setVals(v=>({...v,[f.key]:e.target.value}))}/>}
        </label>
      ))}
      <button onClick={apply} disabled={!n} style={{padding:"6px 14px",borderRadius:8,border:"none",background:n?C.fir:C.mist,color:C.white,fontSize:12,fontWeight:600,cursor:n?"pointer":"not-allowed"}}>应用</button>
      <span style={{flex:1}}/>
      <button onClick={onDelete} style={{padding:"5px 10px",borderRadius:7,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:12,cursor:"pointer"}}>删除所选</button>
      <button onClick={onClear} style={{background:"none",border:"none",color:C.textLight,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>取消选择</button>
    </div>
  );
}

function App(){
  const [professors,setProfessors]=useState(()=>{try{return JSON.parse(localStorage.getItem("phd_professors")||"[]").map(migrateProfessor)}catch{return []}});
  const [applications,setApplications]=useState(()=>{try{return JSON.parse(localStorage.getItem("phd_applications")||"[]").map(migrateApplication)}catch{return []}});
  const [researchTagPool,setResearchTagPool]=useState(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem("phd_research_tags")||"null");
      if(Array.isArray(saved)) return saved;
    }catch{}
    // 首次运行：从已有套磁记录里回填标签池，兼容旧的自由文本研究方向字段
    try{
      const profs=JSON.parse(localStorage.getItem("phd_professors")||"[]");
      const set=new Set();
      profs.forEach(p=>{
        const areas=Array.isArray(p.researchAreas)?p.researchAreas:(p.researchArea?String(p.researchArea).split(/[、,，;；\/]+/).map(s=>s.trim()).filter(Boolean):[]);
        areas.forEach(a=>set.add(a));
      });
      return [...set].sort();
    }catch{ return []; }
  });
  const [mainTab,setMainTab]=useState("professors");
  const [pModal,setPModal]=useState(null);
  const [aModal,setAModal]=useState(null);
  const [pFilter,setPFilter]=useState("all");
  const [aFilter,setAFilter]=useState("all");
  const [view,setView]=useState("卡片");
  const [inboxItems,setInboxItems]=useState([]);
  const [inboxOpen,setInboxOpen]=useState(false);
  const [inboxLoading,setInboxLoading]=useState(false);
  const [inboxError,setInboxError]=useState("");
  const [convertingId,setConvertingId]=useState(null);
  const [convertingInboxId,setConvertingInboxId]=useState(null);
  const [inboxExtractions,setInboxExtractions]=useState({});

  useEffect(()=>{try{localStorage.setItem("phd_professors",JSON.stringify(professors))}catch{}},[professors]);
  useEffect(()=>{try{localStorage.setItem("phd_applications",JSON.stringify(applications))}catch{}},[applications]);
  useEffect(()=>{try{localStorage.setItem("phd_research_tags",JSON.stringify(researchTagPool))}catch{}},[researchTagPool]);
  const addResearchTag=tag=>setResearchTagPool(pool=>pool.includes(tag)?pool:[...pool,tag].sort((a,b)=>a.localeCompare(b,"zh")));

  const saveProf=item=>{
    if(pModal==="add") setProfessors(p=>[...p,{...item,id:Date.now()}]);
    else setProfessors(p=>p.map(x=>x.id===pModal.id?{...pModal,...item}:x));
    setPModal(null);
  };
  const delProf=id=>{if(confirm("确认删除？"))setProfessors(p=>p.filter(x=>x.id!==id));};
  const markFollowed=prof=>{
    const t=todayStr();
    setProfessors(ps=>ps.map(p=>p.id===prof.id?{...p,status:"followed",followedDate:t,contacts:[...(p.contacts||[]),{id:Date.now(),date:t,note:"发送跟进邮件"}]}:p));
  };

  // 列表视图的勾选（切换标签页或视图时清空）
  const [sel,setSel]=useState([]);
  useEffect(()=>setSel([]),[mainTab,view]);
  const toggleSel=id=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const batchProfs=patch=>setProfessors(ps=>ps.map(p=>{
    if(!sel.includes(p.id)) return p;
    const next={...p,...patch};
    // Same defaults as the form: reaching sent/followed without a date means "today".
    if((next.status==="sent"||next.status==="followed")&&!next.sentDate) next.sentDate=todayStr();
    if(next.status==="followed"&&!next.followedDate) next.followedDate=todayStr();
    return next;
  }));
  const batchApps=patch=>setApplications(as=>as.map(a=>{
    if(!sel.includes(a.id)) return a;
    return patch.deadline?{...a,...patch,rolling:false}:{...a,...patch};
  }));
  const batchDelete=()=>{
    if(!confirm(`确认删除所选的 ${sel.length} 条记录？`)) return;
    if(mainTab==="professors") setProfessors(ps=>ps.filter(p=>!sel.includes(p.id)));
    else setApplications(as=>as.filter(a=>!sel.includes(a.id)));
    setSel([]);
  };
  const PROF_BATCH_FIELDS=[
    {key:"status",label:"状态",type:"select",options:PROF_STATUS},
    {key:"sentDate",label:"发送日期",type:"date"},
    {key:"followedDate",label:"跟进日期",type:"date"},
  ];
  const APP_BATCH_FIELDS=[
    {key:"status",label:"状态",type:"select",options:APP_STATUS},
    {key:"cycle",label:"批次",type:"text"},
    {key:"deadline",label:"截止日期",type:"date"},
  ];
  const selCheckbox=(ids)=>{
    const all=ids.length>0&&ids.every(id=>sel.includes(id));
    return <input type="checkbox" checked={all} onChange={()=>setSel(all?sel.filter(id=>!ids.includes(id)):[...new Set([...sel,...ids])])} style={{cursor:"pointer"}}/>;
  };

  const [reminderOpen,setReminderOpen]=useState(false);
  const [acts,setActs]=useState(()=>{try{return JSON.parse(localStorage.getItem("phd_events")||"[]").map(migrateEvent)}catch{return []}});
  useEffect(()=>{try{localStorage.setItem("phd_events",JSON.stringify(acts))}catch{}},[acts]);
  const [actModal,setActModal]=useState(null);
  const saveAct=item=>{
    if(actModal==="add"||!actModal.id) setActs(a=>[...a,{...item,id:Date.now()}]);
    else setActs(a=>a.map(x=>x.id===actModal.id?{...actModal,...item}:x));
    setActModal(null);
    if(convertingInboxId){ deleteInboxItem(convertingInboxId); setConvertingInboxId(null); }
  };
  const delAct=id=>{if(confirm("确认删除这个活动？"))setActs(a=>a.filter(x=>x.id!==id));};
  const setActStatus=(id,status)=>setActs(a=>a.map(x=>x.id===id?{...x,status}:x));
  const closeActModal=()=>{setActModal(null);setConvertingInboxId(null);};

  const reminderEvents=[...buildPhdEvents(professors,applications,todayStr()),...buildActivityEvents(acts,todayStr())];
  const [reminderSync,resyncReminders]=useReminderSync("phd",reminderEvents);

  const saveApp=item=>{
    if(aModal==="add"||!aModal.id) setApplications(a=>[...a,{...item,id:Date.now()}]);
    else setApplications(a=>a.map(x=>x.id===aModal.id?{...aModal,...item}:x));
    setAModal(null);
    if(convertingInboxId){ deleteInboxItem(convertingInboxId); setConvertingInboxId(null); }
  };
  const delApp=id=>{if(confirm("确认删除？"))setApplications(a=>a.filter(x=>x.id!==id));};
  const closeAModal=()=>{setAModal(null);setConvertingInboxId(null);};

  const getInboxKey=()=>{
    let key=localStorage.getItem("jt4_inbox_key")||"";
    if(!key){
      key=prompt("请输入收件箱密钥（部署时在 Vercel 环境变量 INBOX_SECRET 里设置的值）")||"";
      if(key) localStorage.setItem("jt4_inbox_key",key);
    }
    return key;
  };
  const extractForItem=async item=>{
    setInboxExtractions(prev=>({...prev,[item.id]:{loading:true}}));
    try{
      const isEvent=item.kind==="event";
      const res=await fetch(isEvent?"/api/extract-event":"/api/extract-phd",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...(item.type==="url"?{url:item.content}:{text:item.content}),...(isEvent?{context:"phd"}:{})}),
      });
      const json=await res.json();
      setInboxExtractions(prev=>({...prev,[item.id]:{...json,loading:false}}));
    }catch{
      setInboxExtractions(prev=>({...prev,[item.id]:{loading:false,error:true}}));
    }
  };
  const fetchInbox=async()=>{
    const key=getInboxKey();
    if(!key) return;
    setInboxLoading(true); setInboxError("");
    try{
      const res=await fetch("/api/inbox-list?target=phd",{headers:{"X-Inbox-Key":key}});
      if(res.status===401){ setInboxError("⚠️ 密钥错误，点右边「重设密钥」重新输入"); setInboxLoading(false); return; }
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||"failed");
      const items=data.items||[];
      setInboxItems(items);
      items.forEach(item=>{ if(!inboxExtractions[item.id]) extractForItem(item); });
    }catch{ setInboxError("⚠️ 加载失败，检查网络"); }
    setInboxLoading(false);
  };
  const toggleInbox=()=>{
    const next=!inboxOpen;
    setInboxOpen(next);
    if(next) fetchInbox();
  };
  const resetInboxKey=()=>{
    localStorage.removeItem("jt4_inbox_key");
    setInboxError("");
    fetchInbox();
  };
  const deleteInboxItem=async id=>{
    const key=getInboxKey();
    if(key){
      try{
        await fetch("/api/inbox-delete",{
          method:"POST",
          headers:{"Content-Type":"application/json","X-Inbox-Key":key},
          body:JSON.stringify({id,target:"phd"}),
        });
      }catch{}
    }
    setInboxItems(items=>items.filter(i=>i.id!==id));
    setInboxExtractions(prev=>{const next={...prev};delete next[id];return next;});
  };
  const ignoreInboxItem=item=>{ if(confirm("确认忽略这条？")) deleteInboxItem(item.id); };
  const convertInboxToEvent=async item=>{
    setConvertingId(item.id);
    let extracted=item.kind==="event"?inboxExtractions[item.id]:null;
    if(!extracted||extracted.loading||extracted.error){
      try{
        const res=await fetch("/api/extract-event",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({...(item.type==="url"?{url:item.content}:{text:item.content}),context:"phd"}),
        });
        extracted=await res.json();
      }catch{ extracted={}; }
    }
    const pick={};
    ["title","organizer","school","date","time","endTime","timezone","joinUrl","regUrl","regDeadline"].forEach(k=>{if(extracted[k]) pick[k]=extracted[k];});
    setConvertingInboxId(item.id);
    setInboxOpen(false);
    setMainTab("events");
    setActModal({...EMPTY_EVENT,type:EVENT_TYPES.phd[0],...pick,regUrl:pick.regUrl||(item.type==="url"?item.content:""),note:item.type==="url"?"":item.content});
    setConvertingId(null);
  };
  const convertInboxItem=async item=>{
    setConvertingId(item.id);
    let extracted=inboxExtractions[item.id];
    if(!extracted||extracted.loading||extracted.error){
      try{
        const res=await fetch("/api/extract-phd",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(item.type==="url"?{url:item.content}:{text:item.content}),
        });
        extracted=await res.json();
      }catch{ extracted={}; }
    }
    setConvertingInboxId(item.id);
    setInboxOpen(false);
    setMainTab("applications");
    setAModal({
      ...EMPTY_APP,
      school:extracted.school||"",
      program:extracted.program||"",
      cycle:extracted.cycle||"",
      deadline:/^\d{4}-\d{2}-\d{2}$/.test(extracted.deadline||"")?extracted.deadline:"",
      url:item.type==="url"?item.content:"",
      note:item.content,
    });
    setConvertingId(null);
  };

  const remindHot=reminderEvents.filter(e=>e.date===todayStr()||(e.repeatUntilDone&&e.date<todayStr())).length;
  const remindWarn=["badkey","error"].includes(reminderSync.state);
  // 日程卡片点击：按提醒条目的 id 找回对应记录并打开编辑
  const openFromAgenda=e=>{
    const [kind,id]=e.id.split("-");
    const nid=Number(id);
    if(kind==="prof"){const p=professors.find(x=>x.id===nid);if(p){setMainTab("professors");setPModal(p);}}
    else if(kind==="app"){const a=applications.find(x=>x.id===nid);if(a){setMainTab("applications");setAModal(a);}}
    else if(kind==="act"){const a=acts.find(x=>x.id===nid);if(a){setMainTab("events");setActModal(a);}}
  };
  const mainTabBtn=active=>({padding:"8px 20px",borderRadius:20,border:"none",cursor:"pointer",fontSize:14,fontWeight:700,background:active?C.white:C.fir,color:active?C.fir:C.mist,transition:"all 0.2s",whiteSpace:"nowrap",boxShadow:active?"0 2px 8px rgba(0,0,0,0.15)":"none"});
  const selStyle={padding:"6px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,color:C.text,fontSize:13,cursor:"pointer"};
  const tabBtn=active=>({padding:"6px 16px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:active?C.fir:"transparent",color:active?C.white:C.textLight,transition:"all 0.2s"});
  const viewToggle=(
    <div style={{display:"flex",gap:3,background:C.frost,borderRadius:24,padding:3}}>
      {["卡片","列表"].map(v=><button key={v} style={tabBtn(view===v)} onClick={()=>setView(v)}>{v}</button>)}
    </div>
  );
  const thStyle={padding:"11px 12px",textAlign:"left",fontWeight:600,fontSize:12,whiteSpace:"nowrap"};
  const td={padding:"9px 12px"};
  const tableWrap={background:C.white,borderRadius:14,border:`1px solid ${C.border}`,overflow:"auto",boxShadow:`0 2px 12px ${C.shadow}`};
  const rowBtns=(onEdit,onDel)=>(
    <div style={{display:"flex",gap:5}}>
      <button onClick={onEdit} style={{padding:"3px 9px",borderRadius:6,border:`1px solid ${C.border}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>编辑</button>
      <button onClick={onDel} style={{padding:"3px 9px",borderRadius:6,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:11,cursor:"pointer"}}>删除</button>
    </div>
  );

  const filteredApps=applications.filter(a=>aFilter==="all"||a.status===aFilter);

            <Brand/>
            <PageSwitch current="phd"/>
          </div>
          <div className="top-cell top-div-dark" style={{display:"flex",alignItems:"center"}}>
            <div className="tabscroll">
              <div style={{display:"flex",gap:4,background:"rgba(0,0,0,0.18)",borderRadius:24,padding:4,flexShrink:0}}>
                <button className="mtab" style={mainTabBtn(mainTab==="professors")} onClick={()=>setMainTab("professors")}>
                  🧑‍🏫 套磁记录
                  {professors.length>0&&<span style={{background:C.reed,color:C.white,borderRadius:12,padding:"1px 7px",fontSize:11,marginLeft:6,fontWeight:700}}>{professors.length}</span>}
                </button>
                <button className="mtab" style={mainTabBtn(mainTab==="applications")} onClick={()=>setMainTab("applications")}>
                  🎓 网申项目
                  {applications.length>0&&<span style={{background:C.reed,color:C.white,borderRadius:12,padding:"1px 7px",fontSize:11,marginLeft:6,fontWeight:700}}>{applications.length}</span>}
                </button>
              </div>
            </div>
          </div>
          <div className="top-cell top-div-dark hdr-actions" style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:8,flexWrap:"wrap"}}>
            {mainTab==="professors"&&<button onClick={()=>setPModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加套磁记录</button>}
            {mainTab==="applications"&&<button onClick={()=>setAModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加网申项目</button>}
            {mainTab==="events"&&<button onClick={()=>setActModal("add")} style={{background:C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>＋ 添加活动</button>}
          </div>
        </div>
      </div>
      <div style={{background:C.white,borderBottom:`1px solid ${C.border}`}}>
        <div className="top-grid">
          <div className="top-cell">
            <Greeting events={reminderEvents} epigraphItalic epigraph={["Live the questions now."]} epigraphBy="Rainer Maria Rilke, Letters to a Young Poet"/>
            <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
              <button onClick={toggleInbox} style={{background:C.white,color:C.textLight,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>
                📥 收件箱{inboxItems.length>0?` (${inboxItems.length})`:""}
              </button>
              <button onClick={()=>setReminderOpen(true)} title="提醒设置：邮件、日历订阅、同步状态"
              style={{background:remindWarn||remindHot?"#C0392B":C.sage,color:C.white,border:"none",borderRadius:10,padding:"9px 14px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              🔔 提醒{remindHot>0?` (${remindHot})`:""}{remindWarn?" ⚠️":""}
            </button>
            </div>
          </div>
          <div className="top-cell top-div-light" style={{borderLeft:`1px solid ${C.border}`,display:"flex",alignItems:"center"}}>
            <StatList stats={[["已套磁",professors.filter(p=>p.status!=="pending").length],["有回复",professors.filter(p=>["replied","talked","success"].includes(p.status)).length],["网申中",applications.filter(a=>a.status==="submitted"||a.status==="review").length]]}/>

              <span>📅 活动{acts.length?` · ${acts.length}`:""}</span>

        {mainTab==="professors"&&(
          <div className="tab-content">
            {professors.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>
                <div style={{fontSize:36,marginBottom:12}}>🧑‍🏫</div>
                <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无套磁记录</div>
                <div style={{fontSize:13}}>点击「添加套磁记录」开始记录联系过的导师</div>
              </div>
            )}
            {professors.length>0&&(
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                {viewToggle}
                <select style={selStyle} value={pFilter} onChange={e=>setPFilter(e.target.value)}>
                  <option value="all">全部状态</option>
                  {PROF_STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
                </select>
              </div>
            )}
            {view==="卡片"&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
                {filteredProfs.map(prof=>{
                  const linkedApps=applications.filter(a=>(prof.applicationIds||[]).includes(a.id));
                  return <ProfessorCard key={prof.id} prof={prof} linkedApps={linkedApps} onEdit={()=>setPModal(prof)} onDel={()=>delProf(prof.id)} onMarkFollowed={()=>markFollowed(prof)}/>;
                })}
              </div>
            )}
            {view==="列表"&&sel.length>0&&<BatchBar count={sel.length} fields={PROF_BATCH_FIELDS} onApply={batchProfs} onDelete={batchDelete} onClear={()=>setSel([])}/>}
            {view==="列表"&&professors.length>0&&(
              <div style={tableWrap}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:760}}>
                  <thead>
                    <tr style={{background:C.fir,color:C.frost}}>
                      <th style={{...thStyle,width:32}}>{selCheckbox(filteredProfs.map(p=>p.id))}</th>
                      {["导师","院校","研究方向","状态","最新沟通","关联项目","备注","操作"].map(h=><th key={h} style={thStyle}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredProfs.length===0&&<tr><td colSpan={9} style={{textAlign:"center",padding:32,color:C.mist}}>暂无符合条件的记录</td></tr>}
                    {filteredProfs.map((prof,i)=>{
                      const linkedApps=applications.filter(a=>(prof.applicationIds||[]).includes(a.id));
                      const cs=prof.contacts||[];
                      const latest=cs.length>0?cs[cs.length-1]:null;
                      return(
                        <tr key={prof.id} style={{background:sel.includes(prof.id)?C.frost:i%2===0?C.cream:C.white,borderBottom:`1px solid ${C.border}`}}>
                          <td style={td}><input type="checkbox" checked={sel.includes(prof.id)} onChange={()=>toggleSel(prof.id)} style={{cursor:"pointer"}}/></td>
                          <td style={{...td,fontWeight:700,color:C.fir,maxWidth:130,wordBreak:"break-word"}}>
                            {prof.url?<a href={prof.url} title={prof.url} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{prof.name} ↗</a>:prof.name}
                          </td>
                          <td style={{...td,maxWidth:150,wordBreak:"break-word"}}>{prof.institution}</td>
                          <td style={{...td,width:240,maxWidth:240}}>
                            <ResearchTagsCell tags={prof.researchAreas||[]}/>
                          </td>
                          <td style={{...td,minWidth:150}}><StatusTag statusList={PROF_STATUS} s={prof.status}/><FollowupHint prof={prof} onMarkFollowed={()=>markFollowed(prof)}/></td>
                          <td style={{...td,maxWidth:200}}>
                            {latest?<span style={{fontSize:12}}><span style={{color:C.mist}}>{latest.date}</span> <span style={{color:C.text}}>{latest.note}</span></span>:<span style={{color:C.mist,fontSize:12}}>—</span>}
                          </td>
                          <td style={{...td,color:C.textLight,fontSize:12,maxWidth:160,wordBreak:"break-word"}}>{linkedApps.length?linkedApps.map(a=>`${a.school}·${a.program}`).join('，'):"—"}</td>
                          <td style={{...td,color:C.textLight,fontStyle:"italic",maxWidth:110,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={prof.note||""}>{prof.note||"—"}</td>
                          <td style={{...td,whiteSpace:"nowrap"}}>{rowBtns(()=>setPModal(prof),()=>delProf(prof.id))}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {mainTab==="events"&&(
          <div className="tab-content">
            <ActivitiesTab acts={acts} context="phd" applications={applications} onEdit={a=>setActModal(a)} onDel={delAct} onStatus={setActStatus}/>
          </div>
        )}

        {mainTab==="applications"&&(
          <div className="tab-content">
            {applications.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px",color:C.mist}}>
                <div style={{fontSize:36,marginBottom:12}}>🎓</div>
                <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>暂无网申项目</div>
                <div style={{fontSize:13}}>点击「添加网申项目」开始记录申请进度</div>
              </div>
            )}
            {applications.length>0&&(
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                {viewToggle}
                <select style={selStyle} value={aFilter} onChange={e=>setAFilter(e.target.value)}>
                  <option value="all">全部状态</option>
                  {APP_STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
                </select>
              </div>
            )}
            {view==="卡片"&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
                {filteredApps.map(app=>{
                  const linkedProfs=professors.filter(p=>(p.applicationIds||[]).includes(app.id));
                  return <ApplicationCard key={app.id} app={app} linkedProfs={linkedProfs} onEdit={()=>setAModal(app)} onDel={()=>delApp(app.id)}/>;
                })}
              </div>
            )}
            {view==="列表"&&sel.length>0&&<BatchBar count={sel.length} fields={APP_BATCH_FIELDS} onApply={batchApps} onDelete={batchDelete} onClear={()=>setSel([])}/>}
            {view==="列表"&&applications.length>0&&(
              <div style={tableWrap}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:760}}>
                  <thead>
                    <tr style={{background:C.fir,color:C.frost}}>
                      <th style={{...thStyle,width:32}}>{selCheckbox(filteredApps.map(a=>a.id))}</th>
                      {["学校","项目/院系","批次","状态","截止日期","关联导师","备注","操作"].map(h=><th key={h} style={thStyle}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredApps.length===0&&<tr><td colSpan={9} style={{textAlign:"center",padding:32,color:C.mist}}>暂无符合条件的记录</td></tr>}
                    {filteredApps.map((app,i)=>{
                      const linkedProfs=professors.filter(p=>(p.applicationIds||[]).includes(app.id));
                      const daysLeft=app.deadline?diffDays(todayStr(),app.deadline):null;
                      const urgent=daysLeft!==null&&daysLeft<=7&&daysLeft>=0;
                      const expired=daysLeft!==null&&daysLeft<0;
                      return(
                        <tr key={app.id} style={{background:sel.includes(app.id)?C.frost:i%2===0?C.cream:C.white,borderBottom:`1px solid ${C.border}`}}>
                          <td style={td}><input type="checkbox" checked={sel.includes(app.id)} onChange={()=>toggleSel(app.id)} style={{cursor:"pointer"}}/></td>
                          <td style={{...td,fontWeight:700,color:C.fir,maxWidth:150,wordBreak:"break-word"}}>
                            {app.url?<a href={app.url} title={app.url} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{app.school} ↗</a>:app.school}
                          </td>
                          <td style={{...td,maxWidth:170,wordBreak:"break-word"}}>{app.program}</td>
                          <td style={{...td,color:C.textLight,whiteSpace:"nowrap"}}>{app.cycle||"—"}</td>
                          <td style={{...td,whiteSpace:"nowrap"}}><StatusTag statusList={APP_STATUS} s={app.status}/></td>
                          <td style={{...td,whiteSpace:"nowrap",fontSize:12}}>
                            {app.rolling
                              ?<span style={{color:C.textLight}}>🔄 滚动招生</span>
                              :app.deadline
                                ?<span style={{color:urgent?"#e05050":expired?"#aaa":C.textLight,fontWeight:urgent?700:400}}>{app.deadline}{urgent&&" ❗"}{expired&&" (已过期)"}</span>
                                :<span style={{color:C.mist}}>—</span>}
                          </td>
                          <td style={{...td,color:C.textLight,fontSize:12,maxWidth:150,wordBreak:"break-word"}}>{linkedProfs.length?linkedProfs.map(p=>p.name).join('，'):"—"}</td>
                          <td style={{...td,color:C.textLight,fontStyle:"italic",maxWidth:110,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={app.note||""}>{app.note||"—"}</td>
                          <td style={{...td,whiteSpace:"nowrap"}}>{rowBtns(()=>setAModal(app),()=>delApp(app.id))}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

      </div>

      <Modal open={!!pModal} onClose={()=>setPModal(null)}>
        <ProfessorForm initial={pModal==="add"?null:pModal} applications={applications} tagPool={researchTagPool} onAddToPool={addResearchTag} onSave={saveProf} onCancel={()=>setPModal(null)}/>
      </Modal>
      <Modal open={!!aModal} onClose={closeAModal}>
        <ApplicationForm initial={aModal==="add"?null:aModal} onSave={saveApp} onCancel={closeAModal}/>
      </Modal>
      <Modal open={!!actModal} onClose={closeActModal}>
        <ActivityForm key={actModal&&actModal.id?actModal.id:"new"} initial={actModal==="add"?null:actModal} context="phd" applications={applications} onSave={saveAct} onCancel={closeActModal}/>
      </Modal>
      <Modal open={reminderOpen} onClose={()=>setReminderOpen(false)}>
        <ReminderPanel events={reminderEvents} sync={reminderSync} resync={resyncReminders}/>
      </Modal>
      <Modal open={inboxOpen} onClose={()=>setInboxOpen(false)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{color:C.fir,fontSize:17}}>📥 收件箱</h3>
          <button onClick={resetInboxKey} style={{background:"none",border:"none",color:C.textLight,fontSize:11,cursor:"pointer",textDecoration:"underline"}}>🔑 重设密钥</button>
        </div>
        {inboxLoading&&<div style={{fontSize:12,color:C.textLight,textAlign:"center",padding:"12px 0"}}>加载中…</div>}
        {!inboxLoading&&inboxError&&<div style={{fontSize:12,color:"#b05050",textAlign:"center",padding:"12px 0"}}>{inboxError}</div>}
        {!inboxLoading&&!inboxError&&inboxItems.length===0&&<div style={{fontSize:12,color:C.mist,textAlign:"center",padding:"12px 0"}}>收件箱是空的</div>}
        {!inboxLoading&&!inboxError&&inboxItems.map(item=>{
          const ext=inboxExtractions[item.id];
          return(
          <div key={item.id} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",marginBottom:8}}>
            <div style={{fontSize:12,color:C.text,wordBreak:"break-word",whiteSpace:"pre-wrap",marginBottom:6}}>
              {item.type==="url"
                ?<a href={item.content} target="_blank" rel="noopener noreferrer" style={{color:C.fir}}>{item.content}</a>
                :item.content}
            </div>
            {ext&&ext.loading&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>🔍 识别中…</div>}
            {item.kind==="event"&&ext&&!ext.loading&&!ext.error&&<div style={{fontSize:11,color:ext.title?C.sage:C.mist,fontWeight:ext.title?600:400,marginBottom:6}}>
              {ext.title?`📅 推测：${ext.title}${ext.date?` · ${ext.date}`:""}${ext.time?` ${ext.time} ${tzLabel(ext.timezone)}`:""}`:"未识别出活动信息"}
            </div>}
            {item.kind!=="event"&&ext&&!ext.loading&&!ext.error&&ext.school&&<div style={{fontSize:11,color:C.sage,fontWeight:600,marginBottom:6}}>推测：{ext.school}{ext.program?` · ${ext.program}`:""}</div>}
            {item.kind!=="event"&&ext&&!ext.loading&&!ext.error&&!ext.school&&<div style={{fontSize:11,color:C.mist,marginBottom:6}}>未识别出学校/项目信息</div>}
            <div style={{fontSize:10,color:C.mist,marginBottom:6}}>{new Date(item.createdAt).toLocaleString()}</div>
            <div style={{display:"flex",gap:6}}>
              {item.kind==="event"?(
                <button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{flex:1,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成活动"}
                </button>
              ):<>
                <button onClick={()=>convertInboxItem(item)} disabled={convertingId===item.id}
                  style={{flex:1,padding:"5px 0",borderRadius:6,border:"none",background:convertingId===item.id?C.mist:C.sage,color:C.white,fontSize:11,cursor:convertingId===item.id?"not-allowed":"pointer"}}>
                  {convertingId===item.id?"提取中…":"转成网申项目"}
                </button>
                <button onClick={()=>convertInboxToEvent(item)} disabled={convertingId===item.id}
                  style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${C.sage}`,background:C.white,color:C.sage,fontSize:11,cursor:"pointer"}}>转成活动</button>
              </>}
              <button onClick={()=>ignoreInboxItem(item)} style={{padding:"5px 10px",borderRadius:6,border:"1px solid #f5dcdc",background:"#fff5f5",color:"#b05050",fontSize:11,cursor:"pointer"}}>忽略</button>
            </div>
          </div>
          );
        })}
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
